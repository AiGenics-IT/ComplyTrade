<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComplyTrade - Vessel Tracking</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1554ca 0%,#0d3b8a 100%);min-height:100vh;padding:16px}
  .container{max-width:1000px;margin:0 auto}
  .header{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:16px}
  .header h1{font-size:1.6em}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav a{color:#fff;text-decoration:none;padding:6px 14px;border-radius:6px;font-size:.82em;background:rgba(255,255,255,.15);transition:.2s}
  .nav a:hover{background:rgba(255,255,255,.3)}
  .card{background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.2);margin-bottom:16px;overflow:hidden}
  .card-header{padding:14px 18px;font-weight:700;font-size:.95em;color:#1a1a2e;border-bottom:1px solid #eee}
  .card-body{padding:16px 18px}
  .search-row{display:flex;gap:10px;margin-bottom:16px}
  .search-input{flex:1;padding:10px 16px;border:2px solid #e0e5ff;border-radius:8px;font-size:.95em}
  .search-input:focus{outline:none;border-color:#1554ca}
  .btn{padding:10px 20px;border-radius:8px;border:none;font-size:.9em;font-weight:600;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,#1554ca,#0d3b8a);color:#fff}
  .btn-primary:hover{transform:translateY(-1px)}

  .results{display:flex;flex-direction:column;gap:8px}
  .vessel-card{padding:14px;border:1px solid #e0e5ff;border-radius:8px;cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center}
  .vessel-card:hover{background:#f0f4ff;border-color:#1554ca}
  .vessel-name{font-weight:700;font-size:.95em;color:#1554ca}
  .vessel-meta{font-size:.8em;color:#666}
  .vessel-flag{font-size:.82em;color:#888}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:700px){.detail-grid{grid-template-columns:1fr}}
  .detail-section{border:1px solid #eee;border-radius:8px;padding:14px}
  .detail-title{font-weight:700;font-size:.85em;color:#1554ca;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
  .detail-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f5f5f5;font-size:.85em}
  .detail-row:last-child{border-bottom:none}
  .detail-key{color:#666}
  .detail-val{font-weight:600;color:#1a1a2e}

  .port-calls{margin-top:12px}
  .port-call{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:.82em}
  .port-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .port-dot.arrival{background:#16a34a}
  .port-dot.departure{background:#dc2626}
  .port-name{font-weight:600;flex:1}
  .port-time{color:#888;font-size:.9em}

  .sanctions-badge{padding:4px 12px;border-radius:6px;font-size:.78em;font-weight:700}
  .sanctions-badge.clear{background:#dcfce7;color:#16a34a}
  .sanctions-badge.flagged{background:#fee2e2;color:#dc2626}
  .sanctions-badge.unknown{background:#f3f4f6;color:#666}

  .loading{text-align:center;padding:30px;color:#888}
  .spinner{border:3px solid #eee;border-top:3px solid #1554ca;border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:10px auto}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;right:20px;background:#1554ca;color:#fff;padding:12px 20px;border-radius:10px;font-size:.9em;display:none;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Vessel Tracking</h1>
    <div class="nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/interface">Upload</a>
      <a href="/jobs">Jobs</a>
      <a href="/settings">Settings</a>
      <a href="/sanctions">Sanctions</a>
    </div>
  </div>

  <!-- Search -->
  <div class="card">
    <div class="card-header">Search Vessel</div>
    <div class="card-body">
      <div class="search-row">
        <input type="text" class="search-input" id="vessel-name" placeholder="Enter vessel name (e.g., SCION CHARLOTTE, MARCOPOLO 138)" onkeydown="if(event.key==='Enter')searchVessel()">
        <button class="btn btn-primary" onclick="searchVessel()">Search</button>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- Vessel Details -->
  <div id="vessel-detail" style="display:none">
    <div class="card">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
        <span id="detail-title">Vessel Details</span>
        <span class="sanctions-badge unknown" id="sanctions-status">Checking...</span>
      </div>
      <div class="card-body">
        <div class="detail-grid">
          <div class="detail-section">
            <div class="detail-title">Vessel Info</div>
            <div id="vessel-info"></div>
          </div>
          <div class="detail-section">
            <div class="detail-title">Current Position</div>
            <div id="vessel-position"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Port Call History</div>
      <div class="card-body">
        <div id="port-calls" class="port-calls"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = location.origin;

async function searchVessel() {
  const name = document.getElementById('vessel-name').value.trim();
  if (!name) return;
  const el = document.getElementById('search-results');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

  const r = await fetch(`${API}/api/vessel/search?name=${encodeURIComponent(name)}`);
  const d = await r.json();
  const results = d.results || [];

  if (results.length === 0) {
    el.innerHTML = '<div style="color:#999;text-align:center;padding:16px">No vessels found</div>';
    return;
  }

  el.innerHTML = '<div class="results">' + results.slice(0, 10).map(v => `
    <div class="vessel-card" onclick="loadVessel(${v.mmsi}, '${esc(v.name||'')}')">
      <div>
        <div class="vessel-name">${esc(v.name||'Unknown')}</div>
        <div class="vessel-meta">MMSI: ${v.mmsi||'-'} | IMO: ${v.imo||'-'} | Type: ${esc(v.type_text||v.type||'-')}</div>
      </div>
      <div class="vessel-flag">${esc(v.flag||v.country||'')}</div>
    </div>
  `).join('') + '</div>';
}

async function loadVessel(mmsi, name) {
  document.getElementById('vessel-detail').style.display = 'block';
  document.getElementById('detail-title').textContent = name || 'Vessel Details';
  document.getElementById('vessel-info').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  document.getElementById('vessel-position').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  document.getElementById('port-calls').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  // Check sanctions
  checkSanctions(name);

  // Load details
  const dr = await fetch(`${API}/api/vessel/details?mmsi=${mmsi}`);
  const dd = await dr.json();
  const v = dd.vessel || {};

  document.getElementById('vessel-info').innerHTML = `
    <div class="detail-row"><span class="detail-key">Name</span><span class="detail-val">${esc(v.name||name)}</span></div>
    <div class="detail-row"><span class="detail-key">MMSI</span><span class="detail-val">${v.mmsi||mmsi}</span></div>
    <div class="detail-row"><span class="detail-key">IMO</span><span class="detail-val">${v.imo||'-'}</span></div>
    <div class="detail-row"><span class="detail-key">Flag</span><span class="detail-val">${esc(v.flag||v.country||'-')}</span></div>
    <div class="detail-row"><span class="detail-key">Type</span><span class="detail-val">${esc(v.type_text||v.type||'-')}</span></div>
    <div class="detail-row"><span class="detail-key">Built</span><span class="detail-val">${v.built||'-'}</span></div>
    <div class="detail-row"><span class="detail-key">Length</span><span class="detail-val">${v.length ? v.length+'m' : '-'}</span></div>
    <div class="detail-row"><span class="detail-key">DWT</span><span class="detail-val">${v.dwt||'-'}</span></div>
    <div class="detail-row"><span class="detail-key">GT</span><span class="detail-val">${v.gt||'-'}</span></div>
  `;

  document.getElementById('vessel-position').innerHTML = `
    <div class="detail-row"><span class="detail-key">Latitude</span><span class="detail-val">${v.lat||'-'}</span></div>
    <div class="detail-row"><span class="detail-key">Longitude</span><span class="detail-val">${v.lng||'-'}</span></div>
    <div class="detail-row"><span class="detail-key">Speed</span><span class="detail-val">${v.speed ? v.speed+' kn' : '-'}</span></div>
    <div class="detail-row"><span class="detail-key">Course</span><span class="detail-val">${v.course ? v.course+'°' : '-'}</span></div>
    <div class="detail-row"><span class="detail-key">Status</span><span class="detail-val">${esc(v.nav_status_text||v.nav_status||'-')}</span></div>
    <div class="detail-row"><span class="detail-key">Destination</span><span class="detail-val">${esc(v.destination||'-')}</span></div>
    <div class="detail-row"><span class="detail-key">ETA</span><span class="detail-val">${esc(v.eta_utc||v.eta||'-')}</span></div>
    <div class="detail-row"><span class="detail-key">Draught</span><span class="detail-val">${v.draught ? v.draught+'m' : '-'}</span></div>
  `;

  // Load port calls
  const pr = await fetch(`${API}/api/vessel/portcalls?mmsi=${mmsi}&days=60`);
  const pd = await pr.json();
  const calls = pd.port_calls || [];

  if (calls.length === 0) {
    document.getElementById('port-calls').innerHTML = '<div style="color:#999;text-align:center;padding:16px">No port call data available</div>';
  } else {
    document.getElementById('port-calls').innerHTML = calls.slice(0, 20).map(c => `
      <div class="port-call">
        <div class="port-dot ${(c.event||'').toLowerCase().includes('arrival') ? 'arrival' : 'departure'}"></div>
        <span class="port-name">${esc(c.port_name||'-')}</span>
        <span style="color:#aaa;font-size:.8em">${esc(c.event||'')}</span>
        <span class="port-time">${esc(c.time_utc||'')}</span>
      </div>
    `).join('');
  }

  // Scroll to details
  document.getElementById('vessel-detail').scrollIntoView({behavior:'smooth'});
}

async function checkSanctions(vesselName) {
  const badge = document.getElementById('sanctions-status');
  badge.className = 'sanctions-badge unknown';
  badge.textContent = 'Checking...';

  try {
    const r = await fetch(`${API}/api/sanctions`);
    const d = await r.json();
    const banks = (d.banks||[]).map(b=>b.toLowerCase());
    const countries = (d.countries||[]).map(c=>c.toLowerCase());
    const vname = (vesselName||'').toLowerCase();

    // Check if vessel name or flag country is in sanctions
    let flagged = false;
    let reason = '';

    // Check vessel name against bank sanctions (unlikely but possible)
    for (const b of banks) {
      if (vname.includes(b) || b.includes(vname)) {
        flagged = true; reason = 'Vessel name matches sanctioned entity'; break;
      }
    }

    if (!flagged) {
      badge.className = 'sanctions-badge clear';
      badge.textContent = 'No sanctions match';
    } else {
      badge.className = 'sanctions-badge flagged';
      badge.textContent = reason;
    }
  } catch(e) {
    badge.className = 'sanctions-badge unknown';
    badge.textContent = 'Could not check';
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracted Text - ComplyTrade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1e293b; }
        .header { background: linear-gradient(135deg, #1554ca 0%, #0f3a8e 100%); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.15em; display: inline; vertical-align: middle; }
        .layout { display: flex; height: calc(100vh - 48px); }

        /* Sidebar */
        .sidebar { width: 220px; min-width: 220px; background: #fff; border-right: 1px solid #dde3ed; display: flex; flex-direction: column; }
        .sb-head { padding: 10px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 700; font-size: 0.8em; color: #475569; display: flex; justify-content: space-between; }
        .sb-search { padding: 5px 8px; border-bottom: 1px solid #e2e8f0; }
        .sb-search input { width: 100%; padding: 4px 7px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.78em; outline: none; }
        .sb-search input:focus { border-color: #1554ca; }
        .pg-list { flex: 1; overflow-y: auto; }
        .pi { padding: 7px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; gap: 4px; transition: background 0.1s; }
        .pi:hover { background: #eff6ff; }
        .pi.active { background: #dbeafe; border-left: 3px solid #1554ca; }
        .pn { font-weight: 700; font-size: 0.85em; min-width: 16px; }
        .pb { font-size: 0.65em; color: #fff; background: #16a34a; padding: 1px 5px; border-radius: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
        .pb.lc { background: #2563eb; } .pb.amd { background: #7c3aed; } .pb.vlm { background: #d97706; font-size: 0.6em; }
        .pc { font-size: 0.68em; color: #94a3b8; }
        /* Merge chip on sidebar items: tells the user this page is grouped
           with others into the same logical document (e.g. "📎 24,25" on
           both page 24 and page 25). */
        .pmerge { display:inline-flex; align-items:center; gap:2px; background:#ccfbf1; color:#0f766e;
            padding:1px 5px; border-radius:5px; font-size:0.6em; font-weight:700; line-height:1.4;
            border:1px solid #5eead4; white-space:nowrap; }
        .pmerge .pm-ico { font-size:0.9em; }
        /* Toolbar merge banner shown on the active page */
        .merge-info { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:5px;
            background:linear-gradient(135deg,#ccfbf1,#a7f3d0); color:#065f46;
            border:1px solid #5eead4; font-size:0.7em; font-weight:700; cursor:default; }
        .merge-info .mi-others { background:#fff; color:#0f766e; padding:0 5px; border-radius:3px; font-weight:800; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Stats row */
        .stats { display: flex; gap: 0; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .st { flex: 1; text-align: center; padding: 10px 8px; border-right: 1px solid #f1f5f9; }
        .st:last-child { border-right: none; }
        .sv { font-size: 1.2em; font-weight: 800; }
        .sv.v1 { color: #1554ca; } .sv.v2 { color: #1e293b; } .sv.v3 { color: #d97706; } .sv.v4 { color: #16a34a; }
        .sl { font-size: 0.7em; color: #64748b; }

        /* Toolbar — single row */
        .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-wrap: nowrap; }
        .tabs { display: flex; gap: 0; }
        .tb { padding: 5px 12px; cursor: pointer; font-size: 0.78em; font-weight: 600; color: #64748b; background: #fff; border: 1px solid #e2e8f0; transition: all 0.12s; }
        .tb:first-child { border-radius: 5px 0 0 5px; }
        .tb:last-child { border-radius: 0 5px 5px 0; }
        .tb + .tb { border-left: none; }
        .tb.active { color: #fff; background: #1554ca; border-color: #1554ca; }
        .tb.vt { color: #92400e; }
        .tb.vt.active { background: #d97706; border-color: #d97706; color: #fff; }
        .pg-info { font-size: 0.8em; color: #334155; font-weight: 700; }
        .pg-type-lbl { font-size: 0.75em; color: #64748b; }
        .badge-sm { padding: 1px 6px; border-radius: 6px; font-size: 0.68em; font-weight: 600; }
        .badge-orig { background: #dcfce7; color: #166534; }
        .badge-copy { background: #fef3c7; color: #92400e; }
        .badge-vlm { background: #fef3c7; color: #d97706; }
        .spacer { flex: 1; }
        .srch { display: flex; align-items: center; gap: 3px; }
        .srch input { padding: 4px 7px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.76em; width: 150px; outline: none; }
        .srch input:focus { border-color: #1554ca; }
        .si { font-size: 0.7em; color: #94a3b8; min-width: 50px; text-align: center; }
        .btn { background: #e2e8f0; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.74em; cursor: pointer; color: #475569; font-weight: 600; }
        .btn:hover { background: #cbd5e1; }
        .btn.ok { background: #dcfce7; color: #16a34a; }

        /* Content split */
        .content { flex: 1; display: flex; overflow: hidden; }

        /* Image pane */
        .img-pane { width: 40%; min-width: 200px; background: #1a1a2e; display: flex; flex-direction: column; position: relative; }
        .img-pane.hidden { display: none; }
        .img-toolbar { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: #0f0f23; justify-content: flex-end; }
        .img-toolbar .ibtn { background: rgba(255,255,255,0.1); border: none; color: #ccc; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 0.72em; font-weight: 600; }
        .img-toolbar .ibtn:hover { background: rgba(255,255,255,0.25); color: #fff; }
        .img-toolbar .ibtn.active { background: rgba(59,130,246,0.5); color: #fff; }
        .img-toolbar .sep { width: 1px; height: 16px; background: rgba(255,255,255,0.15); }
        .img-toolbar .zlbl { color: #888; font-size: 0.7em; min-width: 35px; text-align: center; }
        .img-wrap { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 8px; }
        .img-wrap img { transition: transform 0.15s; cursor: grab; max-width: 100%; }

        /* Resize handle */
        .rhandle { width: 4px; background: #334155; cursor: col-resize; flex-shrink: 0; }
        .rhandle:hover { background: #3b82f6; }

        /* Text pane */
        .txt-pane { flex: 1; display: flex; flex-direction: column; background: #fff; overflow: hidden; }
        .txt-pane.vlm-bg pre { background: #fffbeb; }
        .txt-tabs { display: flex; gap: 0; padding: 0 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; align-items: flex-end; }
        .txt-tabs .tb { margin-bottom: -1px; border-bottom: 2px solid transparent; border-radius: 0; border: none; background: none; padding: 8px 14px; }
        .txt-tabs .tb.active { border-bottom: 2px solid #1554ca; color: #1554ca; background: #fff; }
        .txt-tabs .tb.vt.active { border-bottom-color: #d97706; color: #d97706; }
        .txt-pane pre { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.8em; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #334155; flex: 1; overflow-y: auto; padding: 14px 18px; margin: 0; }
        /* ── Positioned text view ─────────────────────────────────
           Words rendered at their original page coordinates.
           Goals:
             • Each "page" looks like a real document — white card on a
               soft gradient background with a subtle border + shadow.
             • Gradient background fills the WHOLE viewable area, even
               when the page card is smaller than the viewport.
             • Words sit on their bbox with a faint white pill, so even
               when bboxes overlap slightly the text stays readable.
             • Hover highlights the word (yellow pill, slight lift) so
               you can read text underneath without anything jumping.
             • No horizontal scrollbar — the stage always fits the
               available width; vertical scroll only when needed. */
        .pos-canvas {
            position: relative; flex: 1;
            overflow-x: hidden;        /* never horizontal scroll */
            overflow-y: auto;          /* vertical scroll only when needed */
            background:
              linear-gradient(135deg, #eef2f8 0%, #dde6f3 50%, #e6ecf5 100%);
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        /* Pad-wrap so the stage is centered with consistent gradient
           around it on all sides — without this the stage's auto margins
           don't visually feel padded enough. */
        .pos-canvas .pos-stage-wrap {
            flex: 1 0 auto;
            padding: 18px 18px 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
            width: 100%;
            background:
              linear-gradient(135deg, #eef2f8 0%, #dde6f3 50%, #e6ecf5 100%);
        }
        .pos-canvas .pos-stage {
            position: relative;
            transform-origin: 0 0;
            background: #fff;
            box-shadow:
              0 1px 2px rgba(15,23,42,.06),
              0 8px 28px rgba(15,23,42,.15);
            border: 1px solid #d6dbe4;
            border-radius: 4px;
            margin: 0;
            max-width: 100%;
            flex-shrink: 0;
        }
        /* Subtle ruled-paper feel so empty space has texture */
        .pos-canvas .pos-stage::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background-image:
              linear-gradient(to bottom, rgba(21,84,202,0.03) 0, rgba(21,84,202,0.03) 1px, transparent 1px, transparent 24px);
            border-radius: inherit;
        }
        .pos-canvas .pos-word {
            position: absolute;
            color: #0f172a;
            line-height: 1.05;
            white-space: nowrap;
            padding: 0 2px;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: rgba(255,255,255,0.92);
            border-radius: 2px;
            box-shadow: 0 0 0 0.5px rgba(255,255,255,0.6);
            transition: background .12s ease, box-shadow .12s ease, transform .12s ease;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: text;
        }
        /* Hover: lift the word, fill the highlight to the FULL text
           (overflow:visible + min-width:max-content), and pop above
           neighbors. No native browser tooltip; the word itself is
           the highlight, no separate popup that misaligns below. */
        .pos-canvas .pos-word:hover {
            background: linear-gradient(180deg, #fde68a 0%, #fbbf24 100%);
            color: #111;
            box-shadow:
              0 0 0 1.5px #d97706,
              0 4px 14px rgba(245,158,11,.50),
              0 0 0 4px rgba(253,224,71,.30);
            z-index: 1000;
            overflow: visible;
            text-overflow: clip;
            min-width: max-content;     /* expand bbox to fit text */
            width: auto !important;     /* override inline width */
            padding: 1px 6px;
            border-radius: 4px;
            transform: scale(1.02);
            font-weight: 700;
            cursor: pointer;
        }
        .pos-canvas .pos-word.line {
            color: #1e293b;
            background: rgba(237,242,252,0.7);
            border-left: 2px solid rgba(21,84,202,0.25);
        }
        .pos-canvas .pos-word.line:hover {
            background: linear-gradient(180deg, #fde68a 0%, #fbbf24 100%);
            color: #111;
            border-left-color: #d97706;
        }
        .pos-canvas .pos-empty { color: #94a3b8; font-size: 0.85em; padding: 36px; text-align: center; }
        .pos-toolbar {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px;
            background: linear-gradient(180deg,#eef3fb,#e3ecf9);
            border-bottom: 1px solid #cfdaee;
            font-size: 0.75em; color: #334155;
            position: sticky; top: 0; z-index: 50;
        }
        .pos-toolbar .src-tag { font-weight: 700; padding: 2px 8px; border-radius: 4px; font-size: 0.92em; letter-spacing: .02em; }
        .pos-toolbar .src-tag.pymupdf { background: #dcfce7; color: #166534; }
        .pos-toolbar .src-tag.qwen_vl { background: #ede9fe; color: #5b21b6; }
        .pos-toolbar .src-tag.no_positions { background: #fee2e2; color: #991b1b; }
        .pos-toolbar .ptbtn {
            margin-left:auto; background:#fff; border:1px solid #cfdaee; color:#1554ca;
            padding:3px 9px; border-radius:4px; font-size:.95em; cursor:pointer; font-weight:700;
        }
        .pos-toolbar .ptbtn:hover { background:#1554ca; color:#fff; }
        .pos-toolbar .pt-zoom { display:flex; align-items:center; gap:3px; }
        .pos-toolbar .pt-zoom button {
            background:#fff; border:1px solid #cfdaee; color:#1554ca;
            padding:2px 8px; border-radius:4px; font-size:.95em; cursor:pointer; font-weight:700;
            min-width:24px;
        }
        .pos-toolbar .pt-zoom button:hover { background:#1554ca; color:#fff; }
        .pos-toolbar .pt-zoom .pt-zlabel { color:#64748b; font-size:.95em; min-width:42px; text-align:center; }
        @keyframes posSpin { to { transform: rotate(360deg); } }

        mark { background: #fbbf24; padding: 0 1px; border-radius: 2px; }
        mark.cur { background: #f97316; color: #fff; }
        .no-sel { display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8; flex-direction: column; gap: 6px; font-size: 0.9em; }

        /* Summary tooltip panel */
        .summary-btn { background: linear-gradient(135deg, #1554ca, #0d3b8a); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.74em; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .summary-btn:hover { background: linear-gradient(135deg, #1a66e0, #0f4aa0); }
        .summary-btn svg { width: 13px; height: 13px; fill: currentColor; }
        .summary-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 999; }
        .summary-panel { position: fixed; z-index: 1000; background: #fff; border-radius: 10px; box-shadow: 0 12px 40px rgba(21,84,202,0.22), 0 2px 8px rgba(0,0,0,0.10); max-width: 760px; min-width: 360px; width: min(760px, 90vw); max-height: 78vh; overflow-y: auto; border: 1.5px solid #c7d6f5; }
        .summary-panel-hdr { background: linear-gradient(135deg, #1554ca 0%, #0d3b8a 100%); color: #fff; padding: 10px 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: space-between; }
        .summary-panel-hdr h3 { font-size: 0.88em; margin: 0; font-weight: 700; }
        .summary-panel-close { background: none; border: none; color: rgba(255,255,255,0.8); font-size: 1.1em; cursor: pointer; padding: 0 4px; line-height: 1; }
        .summary-panel-close:hover { color: #fff; }
        .summary-panel-body { padding: 12px 16px; }
        .summary-row { display: flex; padding: 5px 0; border-bottom: 1px solid #f1f5f9; gap: 8px; }
        .summary-row:last-child { border-bottom: none; }
        .summary-key { font-size: 0.76em; font-weight: 700; color: #1554ca; min-width: 100px; flex-shrink: 0; }
        .summary-val { font-size: 0.76em; color: #334155; word-break: break-word; white-space: pre-wrap; }
        .summary-empty { font-size: 0.82em; color: #94a3b8; padding: 16px; text-align: center; }
        @keyframes editFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes editScaleIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.96); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        #ec-toast { animation: editFadeIn .2s ease-out; }
    </style>
</head>
<body>
    <div class="header">
        <div><img src="/logo.png" alt="" style="height:24px;margin-right:8px;vertical-align:middle"><h1>Extracted Text Viewer</h1></div>
        <div style="font-size:0.8em;opacity:0.8" id="ji"></div>
    </div>
    <div class="layout">
        <div class="sidebar">
            <div class="sb-head"><span>Pages</span><span id="pgC"></span></div>
            <div class="sb-search"><input id="sf" placeholder="Filter..." oninput="filterPg()"></div>
            <div class="pg-list" id="pl"></div>
        </div>
        <div class="main">
            <div class="stats" id="sts"></div>
            <div id="vw" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
                <div class="no-sel" id="ns">&#128196;<br>Select a page</div>
                <div id="tbw" style="display:none"><div class="toolbar" id="tb"></div></div>
                <div class="content" id="ct" style="display:none">
                    <div class="txt-pane" id="tp">
                        <div class="txt-tabs" id="ttabs"></div>
                        <pre id="tc"></pre>
                        <div id="tcPos" class="pos-canvas" style="display:none">
                            <div class="pos-toolbar" id="tcPosBar"></div>
                            <div class="pos-stage-wrap" id="tcPosWrap">
                                <div class="pos-stage" id="tcPosStage"></div>
                            </div>
                        </div>
                    </div>
                    <div class="rhandle" id="rh"></div>
                    <div class="img-pane" id="ip">
                        <div class="img-toolbar" id="it"></div>
                        <div class="img-wrap" id="iw"><img id="pi" src="" alt="Page"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
const P=new URLSearchParams(location.search),jobId=P.get('job_id'),API=location.origin;
let pages=[],si=-1,tab='final',zm=1,imgOn=true,hits=[],hi=-1,fit=true,rot=0;

function e(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}
function ct(t){const l=t.toLowerCase();return l==='lc'||l==='mt700'?'lc':l==='amendment'||l==='mt707'?'amd':'';}

async function init(){
    try{
        const r=await fetch(`${API}/api/extracted-text/${jobId}?_=${Date.now()}`,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
        if(!r.ok)throw new Error(`Server ${r.status}`);
        const d=await r.json();pages=d.pages||[];
        document.getElementById('ji').textContent=`Job: ${jobId.substring(0,8)}... | ${d.total_pages} pages`;
        document.getElementById('pgC').textContent=d.total_pages;
        const vp=pages.filter(p=>p.vlm_added).length;
        document.getElementById('sts').innerHTML=`
            <div class="st"><div class="sv v1">${d.total_pages}</div><div class="sl">Pages</div></div>
            <div class="st"><div class="sv v2">${d.total_glm_chars.toLocaleString()}</div><div class="sl">GLM Chars</div></div>
            <div class="st"><div class="sv v3">${vp}</div><div class="sl">VLM Enhanced</div></div>
            <div class="st"><div class="sv v4">${d.total_final_chars.toLocaleString()}</div><div class="sl">Final Chars</div></div>`;
        rList();if(pages.length)sel(0);
    }catch(ex){document.getElementById('ns').innerHTML=`<div style="color:#dc2626">Error: ${ex.message}</div>`;}
}

// Compact format for a list of packet pages on a sidebar chip:
//   [24,25]          → "24,25"
//   [24,25,26,27]    → "24-27"
//   [24,25,28]       → "24,25,28"
// Always omits the current page so users see what other pages are
// merged in: e.g. on page 24 → "+25", on page 25 → "24,+" (or just
// the full list when it's tidy).
function _fmtPacketPages(arr){
    if(!Array.isArray(arr)||arr.length<2)return '';
    const a=arr.slice().sort((x,y)=>x-y);
    // continuous range?
    let cont=true;
    for(let i=1;i<a.length;i++){if(a[i]!==a[i-1]+1){cont=false;break}}
    if(cont)return `${a[0]}-${a[a.length-1]}`;
    return a.join(',');
}

function rList(){
    let h='';pages.forEach((p,i)=>{
        const dt=p.document_type||'Unknown',cls=ct(dt),vb=p.vlm_added?'<span class="pb vlm">VLM</span>':'';
        // Merge chip: show when this page is part of a multi-page packet.
        // The format ("24,25" or "24-27") matches the 8083 server style so
        // the user sees the same grouping on every member page of the packet.
        let mc='';
        if(Array.isArray(p.packet_pages)&&p.packet_pages.length>1){
            const label=_fmtPacketPages(p.packet_pages);
            mc=`<span class="pmerge" title="This page is merged with the others as one logical document">
                <span class="pm-ico">&#128206;</span>${label}
              </span>`;
        }
        h+=`<div class="pi" id="p${i}" onclick="sel(${i})">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
                <span class="pn">${p.page_number}</span>
                <span class="pb ${cls}">${e(dt)}</span>
                ${vb}${mc}
            </div>
            <span class="pc">${p.final_chars.toLocaleString()}</span>
          </div>`;
    });document.getElementById('pl').innerHTML=h;
}

function filterPg(){
    const q=document.getElementById('sf').value.toLowerCase();
    document.querySelectorAll('.pi').forEach((el,i)=>{const p=pages[i];el.style.display=`page ${p.page_number} ${p.document_type||''}`.toLowerCase().includes(q)?'':'none';});
}

function sel(i){
    si=i;tab='final';hits=[];hi=-1;
    document.querySelectorAll('.pi').forEach(x=>x.classList.remove('active'));
    const el=document.getElementById(`p${i}`);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'});}
    const p=pages[i];
    document.getElementById('ns').style.display='none';
    document.getElementById('tbw').style.display='';
    document.getElementById('ct').style.display='flex';
    // Image — use w=800 for fast loading
    const img=document.getElementById('pi');
    img.src=`${API}/api/page-image/${jobId}/${p.page_number}?w=800`;
    img.style.transform='';img.style.maxWidth='100%';zm=1;fit=true;rot=0;
    // Image toolbar
    rImgBar();
    // Tabs above text pane
    const hc=p.cleaned_text&&p.cleaned_text!==p.raw_text,hv=p.vlm_additions&&p.vlm_additions.length>0;
    let tabs=`<div class="tb active" onclick="sTab('final',this)">Flowing text</div><div class="tb" onclick="sTab('raw',this)">Raw OCR</div>`;
    if(hc)tabs+=`<div class="tb" onclick="sTab('cleaned',this)">Cleaned</div>`;
    if(hv)tabs+=`<div class="tb vt" onclick="sTab('vlm',this)">VLM Added</div>`;
    tabs+=`<div class="tb" onclick="sTab('positioned',this)" title="Words rendered at their original page coordinates">Positioned text</div>`;
    document.getElementById('ttabs').innerHTML=tabs;
    // Toolbar — page info + search + copy

// ── Positioned-text renderer ─────────────────────────────────────
const _posCache = {};
const _posZoom  = { val: 1.0 };  // user zoom on top of fit-to-width
let _posRenderToken = 0;  // so a late fetch can't overwrite a newer page

function _posSetZoom(delta){
    if (delta === 0) _posZoom.val = 1.0;
    else _posZoom.val = Math.max(0.5, Math.min(2.5, _posZoom.val + delta));
    if (si >= 0 && tab === 'positioned') renderPositioned(pages[si], true);
}

async function renderPositioned(p, fromZoom){
    const stage = document.getElementById('tcPosStage');
    const bar   = document.getElementById('tcPosBar');
    const key = `${jobId}:${p.page_number}`;
    const myToken = ++_posRenderToken;
    if (!fromZoom) {
        bar.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;color:#1554ca;font-weight:600">
            <span style="width:10px;height:10px;border:2px solid #1554ca;border-top-color:transparent;border-radius:50%;display:inline-block;animation:posSpin .8s linear infinite"></span>
            Extracting word positions for page ${p.page_number}…
          </span>
          <span style="color:#64748b;font-size:.95em">First load on scanned pages may take ~20-90s while the trade expert extracts bounding boxes. Subsequent loads are instant.</span>`;
        stage.innerHTML = '';
    }
    try {
        let data = _posCache[key];
        if (!data) {
            const r = await fetch(`${API}/api/page-positions/${jobId}/${p.page_number}`);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            data = await r.json();
            _posCache[key] = data;
        }
        // A newer page was selected while we were waiting — bail out.
        if (myToken !== _posRenderToken) return;
        const W = data.page_width || 595, H = data.page_height || 842;
        const words = (data.words && data.words.length ? data.words : (data.lines || []));
        if (!words.length) {
            bar.innerHTML = `<span class="src-tag no_positions">no positions</span>
                <span>Source: ${e(data.source || 'n/a')}</span>${data._error ? ' <span style="color:#991b1b">· '+e(data._error)+'</span>' : ''}
                <button class="ptbtn" onclick="(_posCache[\'${e(key)}\']=null,renderPositioned(pages[si]))">Retry</button>`;
            stage.style.width = '';
            stage.style.height = '';
            stage.innerHTML = `<div class="pos-empty">
                No text positions available for this page yet.<br>
                <small>The OCR backend couldn't extract bounding boxes — try Retry, or use the <b>Flowing text</b> tab.</small>
              </div>`;
            return;
        }
        // Fit-to-width with user zoom on top. The wrap container has
        // 18px padding on the sides, so its CONTENT width (where the
        // stage actually lives) is clientWidth minus the padding —
        // not clientWidth itself (which includes padding). Sizing the
        // stage to clientWidth caused it to spill past the right edge.
        const wrap = document.getElementById('tcPosWrap');
        const cs   = wrap ? getComputedStyle(wrap) : null;
        const padL = cs ? parseFloat(cs.paddingLeft  || '0') : 18;
        const padR = cs ? parseFloat(cs.paddingRight || '0') : 18;
        const wrapW = wrap ? wrap.clientWidth : stage.parentElement.clientWidth;
        const panelW = Math.max(200, wrapW - padL - padR - 4); // -4 = safety
        const fit = Math.max(0.4, Math.min(1.0, panelW / W));
        const scale = fit * _posZoom.val;
        // Final stage width is clamped to the content-area width so we
        // never overflow horizontally. Zooming past 100% intentionally
        // allows horizontal scroll if the user opts in.
        const finalW = (_posZoom.val > 1) ? (W * scale) : Math.min(W * scale, panelW);
        const finalH = finalW * (H / W);  // preserve aspect ratio
        const finalScale = finalW / W;
        stage.style.width  = finalW + 'px';
        stage.style.height = finalH + 'px';
        // Build word spans. Three things to avoid:
        //   • native browser tooltip from a title="..." attribute (it
        //     appears below the cursor and overlaps neighboring words);
        //   • words rendered past the stage right/bottom edge (a few VLM
        //     bboxes ride against W/H);
        //   • cramped font sizes that force overflow:hidden + ellipsis.
        // We clamp positions to the stage, size font from bbox height
        // with a sensible cap, and stash the text in a data-attribute
        // so a CSS-only hover popup can show the full word instead of
        // the browser's native title popup.
        const frag = document.createDocumentFragment();
        const isLineMode = data.source === 'qwen_vl';
        const stageW = finalW, stageH = finalH;
        for (const w of words) {
            let x0 = (w.x0 || 0) * finalScale;
            let y0 = (w.y0 || 0) * finalScale;
            let x1 = (w.x1 != null ? w.x1 : (w.x0||0)+50) * finalScale;
            let y1 = (w.y1 != null ? w.y1 : (w.y0||0)+12) * finalScale;
            // Clamp inside the stage so nothing renders past the
            // right or bottom edge.
            x0 = Math.max(0, Math.min(x0, stageW - 4));
            y0 = Math.max(0, Math.min(y0, stageH - 4));
            x1 = Math.max(x0 + 8, Math.min(x1, stageW));
            y1 = Math.max(y0 + 10, Math.min(y1, stageH));
            let ww = x1 - x0;
            let hh = y1 - y0;
            // Degenerate (zero-height) boxes from VLM → reasonable default
            if (hh < 12) hh = Math.min(14, stageH - y0);
            const sp = document.createElement('span');
            sp.className = 'pos-word' + (isLineMode ? ' line' : '');
            sp.style.left = x0.toFixed(1) + 'px';
            sp.style.top  = y0.toFixed(1) + 'px';
            sp.style.width  = ww.toFixed(1) + 'px';
            sp.style.height = hh.toFixed(1) + 'px';
            // Font size: proportional to bbox height, capped at 18px to
            // stop very tall bboxes from blowing up text and pushing
            // into neighbors. Use 0.68 (vs 0.72) for a tiny bit more
            // vertical breathing room.
            const fs = Math.max(7, Math.min(hh * 0.68, 18));
            sp.style.fontSize = fs.toFixed(1) + 'px';
            sp.style.lineHeight = hh.toFixed(1) + 'px';
            sp.style.display = 'inline-block';
            sp.setAttribute('data-text', w.text || '');
            sp.textContent = w.text || '';
            frag.appendChild(sp);
        }
        stage.innerHTML = '';
        stage.appendChild(frag);
        const srcCls = (data.source || 'pymupdf').replace(/[^a-z_]/gi,'_');
        const srcLabel = (data.source === 'pymupdf') ? 'embedded text'
                        : (data.source === 'qwen_vl' ? 'trade expert' : (data.source || 'n/a'));
        bar.innerHTML = `<span class="src-tag ${e(srcCls)}">${e(srcLabel)}</span>
            <span>${data.word_count || words.length} ${isLineMode?'lines':'words'} · ${W}×${H} pt</span>
            <div class="pt-zoom" style="margin-left:auto">
                <button onclick="_posSetZoom(-0.15)" title="Zoom out">&minus;</button>
                <span class="pt-zlabel">${Math.round(_posZoom.val*100)}%</span>
                <button onclick="_posSetZoom(0.15)" title="Zoom in">+</button>
                <button onclick="_posSetZoom(0)" title="Reset to 100%">Reset</button>
            </div>`;
    } catch (err) {
        if (myToken !== _posRenderToken) return;
        bar.innerHTML = `<span class="src-tag no_positions">error</span>
            <span style="color:#991b1b">${e(String(err.message || err))}</span>
            <button class="ptbtn" onclick="(_posCache[\'${e(key)}\']=null,renderPositioned(pages[si]))">Retry</button>`;
        stage.style.width = '';
        stage.style.height = '';
        stage.innerHTML = `<div class="pos-empty">Could not load positions — click Retry.</div>`;
    }
}

function gT(){const p=pages[si];if(!p)return '';switch(tab){case 'raw':return p.raw_text||'';case 'cleaned':return p.cleaned_text||'';case 'vlm':return p.vlm_additions||'';default:return p.final_text||'';}}

// Search
function doS(){
    const q=document.getElementById('sin').value;
    if(!q||q.length<2){hits=[];hi=-1;document.getElementById('sif').textContent='';showT();return;}
    const text=gT(),escaped=e(text);let cnt=0;
    const re=new RegExp(e(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    hits=[];
    const hl=escaped.replace(re,m=>{hits.push(cnt);return `<mark id="h${cnt++}">${m}</mark>`;});
    document.getElementById('tc').innerHTML=hl;
    document.getElementById('sif').textContent=cnt?`${cnt} found`:'None';
    if(cnt>0){hi=0;hCur();}else hi=-1;
}
function hCur(){document.querySelectorAll('mark.cur').forEach(m=>m.classList.remove('cur'));if(hi>=0){const el=document.getElementById(`h${hi}`);if(el){el.classList.add('cur');el.scrollIntoView({block:'center'});}document.getElementById('sif').textContent=`${hi+1}/${hits.length}`;}}
function nH(){if(hits.length){hi=(hi+1)%hits.length;hCur();}}
function pH(){if(hits.length){hi=(hi-1+hits.length)%hits.length;hCur();}}

// Copy
function cpT(btn){navigator.clipboard.writeText(gT()).then(()=>{btn.textContent='Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1200);});}

// Image controls
function zI(d){fit=false;zm=Math.max(0.2,Math.min(4,zm+d));applyZm();}
function zFit(){fit=true;zm=1;const img=document.getElementById('pi');img.style.maxWidth='100%';img.style.transform=rot?`rotate(${rot}deg)`:'';img.style.transformOrigin='center center';rImgBar();}
function z100(){fit=false;zm=1;applyZm();}
function z200(){fit=false;zm=2;applyZm();}
function applyZm(){const img=document.getElementById('pi');img.style.maxWidth='none';img.style.transform=`scale(${zm}) rotate(${rot}deg)`;img.style.transformOrigin='top left';rImgBar();}
function rotL(){rot=(rot-90)%360;fit?zFit():applyZm();}
function rotR(){rot=(rot+90)%360;fit?zFit():applyZm();}
function fullImg(){
    const p=pages[si];if(!p)return;
    const img=document.getElementById('pi');
    img.src=`${API}/api/page-image/${jobId}/${p.page_number}`;// no ?w= = full res
    fit=false;zm=1;applyZm();
}
function togImg(){

    document.getElementById('ip').classList.toggle('hidden',!imgOn);
    document.getElementById('rh').style.display=imgOn?'':'none';

(function(){

            </div>

    inp.focus(); inp.select();

    // Enter to save, Escape to close
    window._ecEscHandler = (ev) => {
        if (ev.key === 'Escape') { ev.preventDefault(); _closeEditForm(); }
        else if (ev.key === 'Enter' && !ev.shiftKey
                 && (ev.target.id === 'ec-type' || ev.target.id === 'ec-notes')) {
            ev.preventDefault(); saveClassOverride();
        }
    };
    document.addEventListener('keydown', window._ecEscHandler);
}

function _ecShowToast(msg, type) {
    // Replace browser alert() with a non-blocking toast.
    const old = document.getElementById('ec-toast');
    if (old) old.remove();
    const colors = type === 'error'
        ? {bg:'#fef2f2', fg:'#991b1b', br:'#fca5a5'}
        : type === 'warn'
            ? {bg:'#fff7ed', fg:'#9a3412', br:'#fdba74'}
            : {bg:'#f0fdf4', fg:'#166534', br:'#86efac'};
    const t = document.createElement('div');
    t.id = 'ec-toast';
    t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${colors.bg};color:${colors.fg};border:1.5px solid ${colors.br};padding:10px 18px;border-radius:8px;font-weight:600;font-size:.88em;box-shadow:0 8px 24px rgba(15,23,42,.18);z-index:2000;animation:editScaleIn .2s ease-out`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.remove(); }, 3200);
}

// ── Summary Tooltip ──
function toggleSummary(evt) {
    // Close if already open
    const existing = document.getElementById('summary-panel');
    if (existing) { closeSummary(); return; }
    const p = pages[si];
    if (!p) return;

    // Wrap the full panel build in try/catch so a future shape
    // mismatch in any one field's data can't silently kill the
    // button. Worst case the user sees an empty panel + a console
    // log instead of "nothing happens" on click.
    let _panel_built_ok = false;
    try {

    // Create overlay to catch outside clicks
    const overlay = document.createElement('div');
    overlay.className = 'summary-overlay';
    overlay.id = 'summary-overlay';
    overlay.onclick = closeSummary;
    document.body.appendChild(overlay);

    // Create panel
    const panel = document.createElement('div');
    panel.className = 'summary-panel';
    panel.id = 'summary-panel';

    // Header — show which pages of the packet contributed to this summary
    const packetPages = Array.isArray(p.packet_pages) && p.packet_pages.length
        ? p.packet_pages : [p.page_number];
    const pagesLabel = packetPages.length > 1
        ? `pages ${packetPages.join(', ')}`
        : `page ${p.page_number}`;
    const nPagesNote = packetPages.length > 1
        ? ` <span style="font-weight:400;opacity:.85;font-size:.9em">(summary built from <b>${packetPages.length} pages</b>: ${packetPages.join(', ')})</span>`
        : '';
    let html = `<div class="summary-panel-hdr"><h3>Document Summary — ${pagesLabel}${nPagesNote}</h3><button class="summary-panel-close" onclick="closeSummary()">&#10005;</button></div>`;

    // Body — parse the pipe-separated summary string or use vlm_summary dict
    html += '<div class="summary-panel-body">';

    // Reclassification banner — if Step 9 reclassified, show both types
    const curType = p.document_type || '';
    const origType = p.original_document_type || '';
    if (origType && origType.toLowerCase().trim() !== curType.toLowerCase().trim() && origType !== 'unknown') {
        html += `<div style="padding:6px 12px;font-size:.72em;background:#fef3c7;color:#78350f;border-bottom:1px solid #fde68a">
          <b>Reclassified:</b> document is <b>${e(curType)}</b>
          <span style="color:#555">(Step 3 originally classified as ${e(origType)}; Step 9 reconciled to current type).</span>
        </div>`;
    }

    // Multi-page coverage banner (inside body, for emphasis)
    if (packetPages.length > 1) {
        // Build a breakdown of what each page actually is, based on
        // the page-level classifications from step03.
        let _pg_breakdown = '';
        try {
            const _pieces = packetPages.map(pg => {
                const _pt = (pages.find(x => x.page_number === pg) || {});
                const _origDt = _pt.original_document_type || _pt.document_type || '';
                return `p${pg}: ${_origDt}`;
            });
            _pg_breakdown = _pieces.join(' • ');
        } catch (_e) { _pg_breakdown = packetPages.join(', '); }
        const _isMergedBl = curType && curType.toLowerCase().includes('+');
        const _bannerHeading = _isMergedBl
            ? 'Merged packet'
            : 'Multi-page document';
        const _bannerDesc = _isMergedBl
            ? `this packet groups ${packetPages.length} related pages — the Bill of Lading together with its attached lists and/or conditions of carriage. The summary is built from ALL pages below:`
            : `this ${packetPages.length}-page packet's summary is built from ALL pages below:`;
        html += `<div style="padding:6px 12px;font-size:.72em;background:#e0f2fe;color:#075985;border-bottom:1px solid #bae6fd">
          <b>${_bannerHeading}:</b> ${_bannerDesc}<br>
          <span style="color:#0369a1">${e(_pg_breakdown)}</span>
        </div>`;
    }
    const summaryStr = p.document_summary || '';
    const vlmSum = p.vlm_summary || {};
    const blSubtype = p.bl_subtype || null;
    const unifiedSum = p.unified_summary || {};
    const pktInfo = p.packet_info || {};
    let hasContent = false;

    // ── Document badges + structure (BL/AWB status, signing, copies, sections) ──
    // Mirrors the badge bar and "Sections inside this document" + "Copy
    // status" blocks the 8083 UI shows. Built from packet_info that the
    // server now surfaces on every member page of the packet.
    {
        const flagLabels = pktInfo.status_flag_labels || [];
        const copies     = pktInfo.copies || [];
        const sections   = pktInfo.sections || [];
        const attReq     = pktInfo.attachments_required || [];
        const attFound   = pktInfo.attachments_found || [];
        const docRef     = pktInfo.doc_ref || '';
        const lcReqOrig  = pktInfo.lc_required_originals;
        const lcReqCopy  = pktInfo.lc_required_copies;
        const matchOrig  = pktInfo.matched_originals_count;
        const matchCopy  = pktInfo.matched_copies_count;
        const matchReason = pktInfo.match_reason || '';
        const printIdx   = pktInfo.printout_index;
        const printTot   = pktInfo.printout_total;
        const hasBadges  = flagLabels.length > 0;
        const hasCopies  = copies.length > 0;
        const hasSections = sections.length > 1;
        const hasAttach  = attReq.length > 0 || attFound.length > 0;
        const hasLcCounts = (lcReqOrig != null || lcReqCopy != null ||
                              matchOrig != null || matchCopy != null);

        if (hasBadges || hasCopies || hasSections || hasAttach || hasLcCounts || docRef) {
            html += `<div style="padding:8px 12px;font-size:.74em;font-weight:700;color:#0f766e;background:linear-gradient(90deg,#ccfbf1,#f0fdfa);border-bottom:1px solid #99f6e4;letter-spacing:.04em;text-transform:uppercase">Document Details</div>`;
            hasContent = true;
        }

        // ── Badge bar: BL/AWB status, signing capacity, printout ──
        if (hasBadges) {
            const badgePalette = (lbl) => {
                const l = lbl.toLowerCase();
                if (l.includes('blank back') || l.includes('short form')) return ['#fff7ed','#9a3412','#fdba74'];
                if (l.includes('t&c overleaf')) return ['#dcfce7','#166534','#86efac'];
                if (l.includes('shipped on board') || l.includes('clean on board')) return ['#dcfce7','#166534','#86efac'];
                if (l.includes('carrier-signed') || l.startsWith('✍')) return ['#dcfce7','#166534','#86efac'];
                if (l.includes('house bl') || l.includes('forwarder')) return ['#fef3c7','#92400e','#fcd34d'];
                if (l.startsWith('printout')) return ['#dbeafe','#1e40af','#93c5fd'];
                return ['#e0e7ff','#3730a3','#a5b4fc']; // default
            };
            html += `<div class="summary-row" style="display:block;padding:8px 12px;background:#fff">
                <div class="summary-key" style="display:block;margin-bottom:6px;font-size:.74em">Status &amp; Signing</div>
                <div style="display:flex;flex-wrap:wrap;gap:5px">`;
            for (const lbl of flagLabels) {
                const [bg, fg, br] = badgePalette(lbl);
                html += `<span style="background:${bg};color:${fg};border:1px solid ${br};padding:2px 9px;border-radius:5px;font-size:.78em;font-weight:600;line-height:1.5">${e(lbl)}</span>`;
            }
            html += `</div></div>`;
        }

        // ── Copy status bar — one pill per printout, with page list ──
        if (hasCopies) {
            const csbPalette = (cp) => {
                const raw = String(cp.copy_label || '').toUpperCase();
                if (raw.includes('NON-NEGOTIABLE') || raw.includes('NON NEGOTIABLE'))
                    return ['#f3e8ff','#6b21a8','#d8b4fe'];
                if (cp.copy_category === 'original') return ['#dcfce7','#166534','#86efac'];
                if (cp.copy_category === 'copy')     return ['#fef3c7','#92400e','#fcd34d'];
                return ['#f1f5f9','#475569','#cbd5e1']; // unmarked
            };
            html += `<div class="summary-row" style="display:block;padding:8px 12px;background:#fafafa">
                <div class="summary-key" style="display:block;margin-bottom:6px;font-size:.74em">Copy status (${copies.length} printout${copies.length===1?'':'s'})</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px">`;
            for (const cp of copies) {
                const [bg, fg, br] = csbPalette(cp);
                const pgList = (cp.pages || []).join(', ');
                const lbl = cp.copy_label || 'UNMARKED';
                html += `<span style="background:${bg};color:${fg};border:1px solid ${br};padding:2px 9px;border-radius:5px;font-size:.78em;font-weight:700;line-height:1.5">${e(lbl)} <span style="opacity:.7;font-weight:400">p ${e(pgList)}</span></span>`;
            }
            html += `</div></div>`;
        }

        // ── LC originals/copies requirement vs matched ──
        if (hasLcCounts) {
            const fmt = (v) => v == null ? '—' : String(v);
            html += `<div class="summary-row" style="background:#fff">
                <span class="summary-key">LC Required</span>
                <span class="summary-val">${fmt(lcReqOrig)} originals · ${fmt(lcReqCopy)} copies</span>
              </div>`;
            html += `<div class="summary-row" style="background:#fff">
                <span class="summary-key">Submitted</span>
                <span class="summary-val">${fmt(matchOrig)} originals · ${fmt(matchCopy)} copies</span>
              </div>`;
            if (matchReason) {
                html += `<div class="summary-row" style="background:#fff">
                    <span class="summary-key">Match Reason</span>
                    <span class="summary-val">${e(matchReason)}</span>
                  </div>`;
            }
        }
        if (docRef) {
            html += `<div class="summary-row" style="background:#fff">
                <span class="summary-key">Doc Ref</span>
                <span class="summary-val">${e(docRef)}</span>
              </div>`;
        }

        // ── Sub-sections inside this logical document ──
        if (hasSections) {
            html += `<div class="summary-row" style="display:block;padding:8px 12px;background:#fafbff">
                <div class="summary-key" style="display:block;margin-bottom:6px;font-size:.74em">Sections inside this document (${sections.length})</div>
                <div style="display:flex;flex-direction:column;gap:4px">`;
            sections.forEach((s, idx) => {
                const pgs = (s.pages || []);
                const pgLbl = pgs.length === 1 ? `page ${pgs[0]}` : `pages ${pgs[0]}–${pgs[pgs.length-1]}`;
                const cnt = `${pgs.length} pg${pgs.length>1?'s':''}`;
                html += `<div style="display:flex;align-items:center;gap:10px;font-size:.82em;padding:3px 0">
                    <span style="color:#94a3b8;font-family:'Consolas',monospace;min-width:22px">${idx+1}.</span>
                    <span style="font-weight:700;color:#0f172a;flex:1">${e(s.type || 'Section')}</span>
                    <span style="color:#64748b;font-family:'Consolas',monospace;font-size:.92em">${e(pgLbl)} · ${e(cnt)}</span>
                  </div>`;
            });
            html += `</div></div>`;
        }

        // ── Attachments ──
        if (hasAttach) {
            if (attReq.length > 0) {
                html += `<div class="summary-row" style="background:#fff">
                    <span class="summary-key">Attachments Required</span>
                    <span class="summary-val">${attReq.map(a => `<span style="display:inline-block;background:#fef3c7;color:#92400e;padding:1px 7px;border-radius:4px;font-size:.92em;margin:1px 3px 1px 0">${e(a)}</span>`).join('')}</span>
                  </div>`;
            }
            if (attFound.length > 0) {
                html += `<div class="summary-row" style="background:#fff">
                    <span class="summary-key">Attachments Found</span>
                    <span class="summary-val">${attFound.map(a => `<span style="display:inline-block;background:#dcfce7;color:#166534;padding:1px 7px;border-radius:4px;font-size:.92em;margin:1px 3px 1px 0">${e(a)}</span>`).join('')}</span>
                  </div>`;
            }
        }
    }

    // ── Step 3 BL Sub-type block (only for Bill of Lading pages) ──
    // P198gz60 — guard against a STRING bl_subtype. The 8083 path
    // sometimes emits bl_subtype as a plain title string (e.g.
    // "Multimodal Transport Bill of Lading"); Object.keys() of a
    // string returns char indexes and the loop below would iterate
    // each character. The badge bar in "Document Details" above
    // already shows the title as a chip, so just skip this legacy
    // structured block when the value isn't a dict.
    if (blSubtype && typeof blSubtype === 'object' && !Array.isArray(blSubtype)
            && Object.keys(blSubtype).length > 0) {
        // Preferred order for readability; any other keys fall through at the bottom.
        const blOrder = [
            'bl_type_description',
            'form_type', 'contract_type', 'issuer_type', 'signing_type',
            'cleanness', 'is_claused_bl', 'clausing_notes',
            'shipped_on_board_status', 'negotiability', 'consigned_form',
            'freight_status',
            'has_terms_overleaf', 'is_blank_back',
            'is_short_form', 'is_house_bl', 'is_charter_party_bl',
            'carrier_name', 'forwarder_name',
        ];
        const prettyLabel = (k) => k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const fmtVal = (v) => {
            if (typeof v === 'boolean') return v ? 'Yes' : 'No';
            if (Array.isArray(v)) return v.join(', ');
            if (typeof v === 'object' && v !== null) return JSON.stringify(v);
            return String(v || '').replace(/_/g, ' ');
        };
        html += `<div style="padding:8px 12px;font-size:.76em;font-weight:700;color:#2c8a2c;background:#f0fdf4;border-bottom:1px solid #bbf7d0">BL Sub-type (Step 3d)</div>`;
        const renderedBL = new Set();
        const renderBL = (k, v) => {
            if (v === undefined || v === null || v === '' || v === 'unknown') return;
            // Skip purely false booleans unless it's a "cleanness/status" indicator worth
            // showing; keep True values and non-boolean values.
            if (typeof v === 'boolean' && v === false && !['has_terms_overleaf','is_blank_back'].includes(k)) return;
            html += `<div class="summary-row"><span class="summary-key">${e(prettyLabel(k))}</span><span class="summary-val">${e(fmtVal(v))}</span></div>`;
            hasContent = true;
            renderedBL.add(k);
        };
        // First pass: preferred order
        for (const k of blOrder) {
            if (k in blSubtype) renderBL(k, blSubtype[k]);
        }
        // Second pass: any other bl_subtype keys the prompt might invent
        for (const [k, v] of Object.entries(blSubtype)) {
            if (k.startsWith('_') || renderedBL.has(k)) continue;
            renderBL(k, v);
        }
    }

    // ── Step 3e Unified Summary block (all packets; rich BL fields when BL) ──
    if (Object.keys(unifiedSum).length > 0) {
        // Field display order; anything not here gets rendered at the bottom in raw order
        const preferredOrder = [
            'document_identifier','bl_number','bl_date','ntn_number','issue_date',
            'issuer','signed_by','shipper','consignee','notify_party',
            'drawer','drawee','payee',
            'goods_description','hs_codes','marks_and_numbers',
            'quantity','number_of_packages','package_type',
            'gross_weight','net_weight','measurement',
            'vessel_name','voyage_number','port_of_loading','port_of_discharge',
            'place_of_receipt','place_of_delivery','shipment_date','onboard_date',
            'container_numbers','seal_numbers','number_of_originals',
            'freight_terms','freight_amount','amount',
            'lc_reference','invoice_reference','contract_reference','charter_party_reference',
            'key_clauses','cross_references','notes',
        ];
        html += `<div style="padding:8px 12px;font-size:.76em;font-weight:700;color:#1554ca;background:#eff6ff;border-bottom:1px solid #bfdbfe">Packet Summary (Step 3e)</div>`;
        const rendered = new Set();
        // Unwrap an LLM-returned object into a readable string, preferring
        // common value fields — the LLM sometimes returns typed fields as
        // structured objects (e.g. {"role":"lc_reference","value":"...","raw":"..."})
        // instead of plain strings.
        const unwrapObj = (obj) => {
            if (!obj || typeof obj !== 'object') return String(obj || '');
            // Prefer: value > name > raw > in_words > any non-meta key
            const preferredKeys = ['value', 'name', 'text', 'raw', 'in_words', 'amount'];
            for (const k of preferredKeys) {
                if (obj[k]) {
                    const extra = [];
                    if (obj.currency && k !== 'raw') extra.push(obj.currency);
                    extra.push(String(obj[k]));
                    if (obj.unit) extra.push(String(obj.unit));
                    if (obj.in_words && k !== 'in_words') extra.push(`(${obj.in_words})`);
                    return extra.join(' ').trim();
                }
            }
            // Fallback: pretty key=value pairs, skipping role/meta keys
            return Object.entries(obj)
                .filter(([k, v]) => v && !['role','_error','_raw'].includes(k))
                .map(([k, v]) => `${k}=${v}`).join(', ');
        };
        const renderField = (key, val) => {
            if (val === undefined || val === null || val === '' || val === 'unknown') return;
            if (Array.isArray(val)) {
                if (val.length === 0) return;
                // Structured array (each item is {role, value, ...}) — handled below
                if (typeof val[0] === 'object') return;
                val = val.join(', ');
            } else if (typeof val === 'object') {
                val = unwrapObj(val);
            }
            const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            html += `<div class="summary-row"><span class="summary-key">${e(label)}</span><span class="summary-val">${e(String(val))}</span></div>`;
            hasContent = true;
            rendered.add(key);
        };

        // ── Structured arrays: dates / amounts / references / parties ──
        const renderStructuredArr = (key, items, formatter) => {
            if (!Array.isArray(items) || items.length === 0) return;
            const title = key.replace(/_found$/, '').replace(/\b\w/g, c => c.toUpperCase());
            html += `<div class="summary-row" style="background:#fafbff;padding:6px 0"><span class="summary-key" style="color:#0d3b8a">${e(title)} (${items.length})</span><span class="summary-val" style="display:block">`;
            items.forEach(it => {
                if (!it || typeof it !== 'object') return;
                html += `<div style="padding:2px 0;border-bottom:1px dotted #dbe5f5">${formatter(it)}</div>`;
            });
            html += `</span></div>`;
            hasContent = true;
            rendered.add(key);
        };
        // No substring truncation — show the FULL raw/address/in_words text.
        renderStructuredArr('dates_found', unifiedSum.dates_found, (d) => {
            const role = e((d.role || 'other').replace(/_/g, ' '));
            const val = e(d.value || d.raw || '');
            const raw = d.raw && d.raw !== d.value ? ` <span style="color:#888;font-size:.92em">— ${e(d.raw)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${val}${raw}`;
        });
        renderStructuredArr('amounts_found', unifiedSum.amounts_found, (a) => {
            const role = e((a.role || 'other').replace(/_/g, ' '));
            const cur = a.currency || '';
            const val = e(a.value || a.raw || '');
            const words = a.in_words ? ` <span style="color:#888;font-size:.92em">(${e(a.in_words)})</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${e(cur)} ${val}${words}`;
        });
        renderStructuredArr('quantities_found', unifiedSum.quantities_found, (q) => {
            const role = e((q.role || 'other').replace(/_/g, ' '));
            const val = e(q.value || q.raw || '');
            const unit = q.unit ? ` ${e(q.unit)}` : '';
            const raw = q.raw && q.raw !== q.value ? ` <span style="color:#888;font-size:.92em">— ${e(q.raw)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${val}${unit}${raw}`;
        });
        renderStructuredArr('references_found', unifiedSum.references_found, (r) => {
            const role = e((r.role || 'other').replace(/_/g, ' '));
            const val = e(r.value || r.raw || '');
            return `<b style="color:#1554ca">${role}:</b> ${val}`;
        });
        renderStructuredArr('parties_found', unifiedSum.parties_found, (p) => {
            const role = e((p.role || 'other').replace(/_/g, ' '));
            const name = e(p.name || p.raw || '');
            const addr = p.address ? ` <span style="color:#888;font-size:.9em">— ${e(p.address)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${name}${addr}`;
        });
        renderStructuredArr('other_details_found', unifiedSum.other_details_found, (o) => {
            const role = e((o.role || 'other').replace(/_/g, ' '));
            const val = e(o.value || o.raw || '');
            const raw = o.raw && o.raw !== o.value ? ` <span style="color:#888;font-size:.9em">— ${e(o.raw)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${val}${raw}`;
        });

        for (const k of preferredOrder) {
            if (k in unifiedSum) renderField(k, unifiedSum[k]);
        }
        // Any other fields returned by the LLM that we didn't list above
        for (const [k, v] of Object.entries(unifiedSum)) {
            if (!rendered.has(k) && !k.startsWith('_')) renderField(k, v);
        }
    }

    if (Object.keys(vlmSum).length > 0) {
        // Structured summary from _vlm_summary
        // Show description paragraph first if available
        const desc = vlmSum.description || '';
        if (desc && desc.length > 5) {
            html += `<div style="padding:8px 12px;font-size:.82em;color:#333;line-height:1.5;border-bottom:1px solid #e5e7eb;background:#f8fafc">${e(desc)}</div>`;
            hasContent = true;
        }
        for (const [key, val] of Object.entries(vlmSum)) {
            if (key === 'description') continue;  // already shown above
            if (!val || String(val).trim() === '' || ['none','n/a','unknown','nil'].includes(String(val).trim().toLowerCase())) continue;
            const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            html += `<div class="summary-row"><span class="summary-key">${e(label)}</span><span class="summary-val">${e(String(val))}</span></div>`;
            hasContent = true;
        }
    } else if (summaryStr) {
        // Pipe-separated format: "Key: Value | Key: Value"
        const parts = summaryStr.split(' | ');
        for (const part of parts) {
            const colonIdx = part.indexOf(': ');
            if (colonIdx > 0) {
                const key = part.substring(0, colonIdx).trim();
                const val = part.substring(colonIdx + 2).trim();
                if (val && !['none','n/a','unknown','nil'].includes(val.toLowerCase())) {
                    html += `<div class="summary-row"><span class="summary-key">${e(key)}</span><span class="summary-val">${e(val)}</span></div>`;
                    hasContent = true;
                }
            }
        }
    }

    // ── Full extracted-fields section (8083 deep-extract) ────────
    // Render scalar / object / array fields as readable rows + tables.
    // This is the "all detected fields" view the user asked for.
    const fields = p.extracted_fields || {};
    // Hide internal/metadata keys + vendor exposes
    const SKIP_KEYS = new Set([
        '_extract_source', 'Extract Source', 'extract_source',
        '_deep_extract_error', '_doc_type_override_from_fields',
        '_promoted_from_extras_after_reconcile',
    ]);
    const keys = Object.keys(fields || {}).filter(k =>
        !k.startsWith('_') && !SKIP_KEYS.has(k)
    );
    if (keys.length > 0) {
        const scalarKeys = [];
        const objectKeys = [];
        const arrayKeys  = [];
        for (const k of keys) {
            const v = fields[k];
            if (Array.isArray(v)) {
                if (v.length === 0) continue;
                arrayKeys.push(k);
            } else if (v && typeof v === 'object') {
                if (Object.keys(v).length === 0) continue;
                objectKeys.push(k);
            } else if (v !== null && v !== undefined && String(v).trim() !== '') {
                scalarKeys.push(k);
            }
        }

        if (scalarKeys.length + objectKeys.length + arrayKeys.length > 0) {
            html += `<div style="padding:9px 12px;font-size:.74em;font-weight:700;color:#0d3b8a;background:linear-gradient(90deg,#dbeafe,#eff6ff);border-bottom:1px solid #bfdbfe;letter-spacing:.04em;text-transform:uppercase">All detected fields</div>`;
        }

        // Scalar fields → label/value rows
        for (const k of scalarKeys) {
            const v = fields[k];
            html += `<div class="summary-row"><span class="summary-key">${e(k)}</span><span class="summary-val">${e(String(v))}</span></div>`;
            hasContent = true;
        }

        // Object fields → nested key/value mini-table
        for (const k of objectKeys) {
            const v = fields[k];
            const rows = Object.entries(v)
                .filter(([_kk, _vv]) => _vv !== null && _vv !== undefined && String(_vv).trim() !== '' && !String(_kk).startsWith('_'))
                .map(([kk, vv]) => {
                    const valStr = (typeof vv === 'object') ? JSON.stringify(vv) : String(vv);
                    return `<tr><td style="padding:3px 8px;background:#f8fafc;font-weight:600;color:#1554ca;border:1px solid #e2e8f0;font-size:.92em">${e(kk)}</td>
                            <td style="padding:3px 8px;border:1px solid #e2e8f0;font-size:.92em">${e(valStr)}</td></tr>`;
                }).join('');
            if (!rows) continue;
            html += `<div class="summary-row" style="display:block;background:#fff;padding:4px 0">
                <div class="summary-key" style="display:block;margin-bottom:4px">${e(k)}</div>
                <table style="width:100%;border-collapse:collapse">${rows}</table>
            </div>`;
            hasContent = true;
        }

        // Array fields → table (auto-detect columns from first element)
        for (const k of arrayKeys) {
            const arr = fields[k];
            const first = arr[0];
            if (first && typeof first === 'object' && !Array.isArray(first)) {
                // Array of objects → table
                const cols = [];
                for (const row of arr) {
                    for (const cKey of Object.keys(row)) {
                        if (!cols.includes(cKey) && !String(cKey).startsWith('_')) cols.push(cKey);
                    }
                }
                const head = cols.map(c => `<th style="padding:5px 8px;background:#1e40af;color:#fff;text-align:left;font-weight:700;font-size:.78em;border:1px solid #1e3a8a">${e(c)}</th>`).join('');
                const rows = arr.map((row, i) => {
                    const bg = i % 2 ? '#f8fafc' : '#ffffff';
                    return '<tr>' + cols.map(c => {
                        const v = row[c];
                        const txt = v === null || v === undefined ? ''
                                  : (typeof v === 'object' ? JSON.stringify(v) : String(v));
                        return `<td style="padding:4px 8px;background:${bg};border:1px solid #e2e8f0;font-size:.85em;vertical-align:top;color:#1f2937">${e(txt)}</td>`;
                    }).join('') + '</tr>';
                }).join('');
                html += `<div class="summary-row" style="display:block;background:#fff;padding:6px 0">
                    <div class="summary-key" style="display:block;margin-bottom:5px">${e(k)} <span style="color:#94a3b8;font-weight:400;font-size:.9em">(${arr.length} ${arr.length===1?'row':'rows'})</span></div>
                    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
                        <thead><tr>${head}</tr></thead>
                        <tbody>${rows}</tbody>
                    </table></div>
                </div>`;
                hasContent = true;
            } else {
                // Array of strings → comma list
                const txt = arr.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(', ');
                html += `<div class="summary-row"><span class="summary-key">${e(k)}</span><span class="summary-val">${e(txt)}</span></div>`;
                hasContent = true;
            }
        }
    }

    if (!hasContent) {
        html += '<div class="summary-empty">No summary available for this page.</div>';
    }
    html += '</div>';
    panel.innerHTML = html;

    // Position near the button
    document.body.appendChild(panel);
    const btnRect = evt.target.closest('.summary-btn').getBoundingClientRect();
    let top = btnRect.bottom + 6;
    let left = btnRect.left;
    // Keep within viewport. If the panel is taller than the available
    // space below AND above, anchor it to the top of the viewport so
    // it never renders off-screen — the user can scroll inside the
    // panel (max-height:78vh + overflow-y:auto).
    const panelRect = panel.getBoundingClientRect();
    if (left + panelRect.width > window.innerWidth - 12) left = window.innerWidth - panelRect.width - 12;
    if (left < 12) left = 12;
    if (top + panelRect.height > window.innerHeight - 12) {
        const flipped = btnRect.top - panelRect.height - 6;
        // If flipping up would put it above the viewport (negative top),
        // pin it to a safe spot near the top of the viewport instead.
        top = flipped >= 12 ? flipped : 12;
    }
    panel.style.top = top + 'px';
    panel.style.left = left + 'px';
    _panel_built_ok = true;
    } catch (err) {
        console.error('[toggleSummary] panel build failed:', err);
        // Clean up partial state so the next click starts fresh
        const _o = document.getElementById('summary-overlay'); if (_o) _o.remove();
        const _p = document.getElementById('summary-panel');   if (_p) _p.remove();
        // Show a minimal fallback panel so the user gets feedback
        const fb = document.createElement('div');
        fb.className = 'summary-panel';
        fb.id = 'summary-panel';
        fb.style.cssText = 'top:80px;left:50%;transform:translateX(-50%);width:min(600px,90vw)';
        fb.innerHTML = `<div class="summary-panel-hdr"><h3>Document Summary — page ${p.page_number}</h3><button class="summary-panel-close" onclick="closeSummary()">&#10005;</button></div>
            <div class="summary-panel-body"><div style="padding:14px;color:#b91c1c;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;font-size:.84em">
              <b>Summary rendering hit an issue.</b><br>
              <span style="color:#555">${e(String(err && err.message || err))}</span><br>
              <small>Open the browser console for the full stack.</small>
            </div></div>`;
        const ov = document.createElement('div'); ov.className='summary-overlay'; ov.id='summary-overlay'; ov.onclick=closeSummary;
        document.body.appendChild(ov);
        document.body.appendChild(fb);
    }
}

    const panel = document.getElementById('summary-panel');
    const overlay = document.getElementById('summary-overlay');

    if (signatures.length > 0) {
        html += '<div style="padding:6px 12px;font-size:.72em;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #f3f4f6">Signatures</div>';
        for (const s of signatures) {
            const desc = (typeof s === 'string') ? s : (s.description || s.text || JSON.stringify(s));
            const type = (typeof s === 'object' && s.type) ? s.type : '';

// ── Document Merging Sequence ──
// Shows the user how the system grouped raw pages into logical
// documents — colour-coded chips, packet headers, current page
// highlighted. Built on the fly from the already-loaded `pages` array
// so no extra fetch is needed.
function toggleSequence(evt) {
    const existing = document.getElementById('seq-panel');
    if (existing) { closeSequence(); return; }

    const overlay = document.createElement('div');
    overlay.className = 'summary-overlay';
    overlay.id = 'seq-overlay';
    overlay.onclick = closeSequence;
    document.body.appendChild(overlay);

    const panel = document.createElement('div');
    panel.className = 'summary-panel';
    panel.id = 'seq-panel';
    panel.style.maxWidth = '820px';
    panel.style.width = 'min(820px, 92vw)';

    // Group pages by packet_id, keeping order of first appearance
    const packets = [];
    const pktIdx = {};
    for (const p of pages) {
        const pid = p.packet_id || ('pg_' + p.page_number);
        if (!(pid in pktIdx)) {
            pktIdx[pid] = packets.length;
            packets.push({
                packet_id: pid,
                document_type: p.document_type || 'Unknown',
                copy_status: p.copy_status || '',
                packet_pages: Array.isArray(p.packet_pages) && p.packet_pages.length ? p.packet_pages : [p.page_number],
                pages: [],
            });
        }
        packets[pktIdx[pid]].pages.push(p);
    }
    // Sort packets by their lowest page number
    packets.sort((a, b) => {
        const aMin = Math.min(...(a.packet_pages || [9999]));
        const bMin = Math.min(...(b.packet_pages || [9999]));
        return aMin - bMin;
    });

    // Build palette for doc-type chips (stable across types)
    const palette = [
        ['#1554ca','#dbeafe'], ['#7c3aed','#ede9fe'], ['#0d9488','#ccfbf1'],
        ['#d97706','#fef3c7'], ['#16a34a','#dcfce7'], ['#dc2626','#fee2e2'],
        ['#0369a1','#e0f2fe'], ['#9333ea','#f3e8ff'], ['#0891b2','#cffafe'],
        ['#65a30d','#ecfccb'], ['#ea580c','#ffedd5'], ['#be123c','#ffe4e6'],
    ];
    const typeColor = {};
    const colorFor = (t) => {
        const k = (t || 'unknown').toLowerCase().trim();
        if (!(k in typeColor)) {
            typeColor[k] = palette[Object.keys(typeColor).length % palette.length];
        }
        return typeColor[k];
    };

    // Header
    const curPg = (si >= 0 && pages[si]) ? pages[si].page_number : -1;
    const totalPages = pages.length;
    let html = `<div class="summary-panel-hdr" style="background:linear-gradient(135deg,#0d9488 0%,#0f766e 100%)">
        <h3>Document Merging Sequence — ${packets.length} document${packets.length===1?'':'s'} from ${totalPages} page${totalPages===1?'':'s'}</h3>
        <button class="summary-panel-close" onclick="closeSequence()">&#10005;</button>
      </div>`;
    html += '<div class="summary-panel-body" style="padding:0">';
    html += `<div style="padding:10px 16px;font-size:.74em;color:#475569;background:#f0fdfa;border-bottom:1px solid #ccfbf1;line-height:1.5">
        <b>How to read this:</b> each card below is one <i>logical document</i> the system identified.
        The page chips show which raw PDF pages were merged into that document.
        Multi-page packets are pages the system grouped together (e.g. a Bill of Lading + Attached Sheet).
        The currently-selected page is outlined in orange.
      </div>`;

    // Render each packet as a card
    html += '<div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">';
    packets.forEach((pk, i) => {
        const [fg, bg] = colorFor(pk.document_type);
        const pgList = (pk.packet_pages || []).slice().sort((a, b) => a - b);
        const pgChips = pgList.map(pn => {
            const isCur = pn === curPg;
            return `<span onclick="(function(){const idx=pages.findIndex(x=>x.page_number===${pn});if(idx>=0){closeSequence();sel(idx);}})()"
                style="display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 7px;
                border-radius:6px;background:${isCur?'#fff7ed':'#f1f5f9'};color:${isCur?'#9a3412':'#1e293b'};
                font-weight:700;font-size:.82em;border:1.5px solid ${isCur?'#f97316':'#cbd5e1'};
                cursor:pointer;transition:all .15s" title="Jump to page ${pn}">${pn}</span>`;
        }).join('');
        // Build a sub-stamp for any per-page doc-type variation inside the packet
        const subTypes = {};
        for (const pg of pk.pages) {
            const t = pg.original_document_type || pg.document_type || 'Unknown';
            if (!(t in subTypes)) subTypes[t] = [];
            subTypes[t].push(pg.page_number);
        }
        const isMixed = Object.keys(subTypes).length > 1;
        const mixedNote = isMixed
            ? `<div style="margin-top:8px;font-size:.72em;color:#475569;padding-top:8px;border-top:1px dashed #e2e8f0">
                  <b style="color:#0f766e">Merged from:</b>
                  ${Object.entries(subTypes).map(([t, pgs]) => {
                      const [tfg, tbg] = colorFor(t);
                      return `<span style="display:inline-block;background:${tbg};color:${tfg};padding:1px 7px;border-radius:4px;margin:2px 4px 0 0;font-weight:600">${e(t)} <span style="opacity:.7;font-weight:400">(p${pgs.join(',')})</span></span>`;
                  }).join('')}
              </div>`
            : '';
        const cs = pk.copy_status
            ? `<span style="margin-left:8px;background:${pk.copy_status==='original'?'#dcfce7':'#fef3c7'};color:${pk.copy_status==='original'?'#166534':'#92400e'};padding:1px 7px;border-radius:4px;font-size:.7em;font-weight:700;text-transform:uppercase">${e(pk.copy_status)}</span>`
            : '';
        html += `<div style="border:1.5px solid #e2e8f0;border-left:4px solid ${fg};border-radius:8px;padding:10px 12px;background:#fff;transition:all .15s">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
                <span style="background:${fg};color:#fff;font-weight:700;font-size:.72em;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center">${i+1}</span>
                <span style="background:${bg};color:${fg};font-weight:700;padding:3px 10px;border-radius:5px;font-size:.82em">${e(pk.document_type)}</span>
                <span style="color:#64748b;font-size:.72em">${pgList.length} page${pgList.length===1?'':'s'}</span>${cs}
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
                <span style="color:#94a3b8;font-size:.72em;margin-right:4px">Pages:</span>
                ${pgChips}
            </div>
            ${mixedNote}
        </div>`;
        // Flow arrow between cards
        if (i < packets.length - 1) {
            html += `<div style="text-align:center;color:#cbd5e1;font-size:1.2em;line-height:.4;margin:-4px 0">&#x2193;</div>`;
        }
    });
    html += '</div>';

    // Footer legend
    html += `<div style="padding:10px 16px;font-size:.72em;color:#64748b;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;gap:14px;flex-wrap:wrap">
        <span><b style="color:#0f766e">Click any page chip</b> to jump to it</span>
        <span><span style="display:inline-block;width:14px;height:14px;border:2px solid #f97316;background:#fff7ed;border-radius:3px;vertical-align:middle;margin-right:3px"></span>= current page</span>
      </div>`;
    html += '</div>';
    panel.innerHTML = html;

    document.body.appendChild(panel);
    const rect = evt.target.closest('button').getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    const pr = panel.getBoundingClientRect();
    if (left + pr.width > window.innerWidth - 12) left = window.innerWidth - pr.width - 12;
    if (left < 12) left = 12;
    if (top + pr.height > window.innerHeight - 12) top = Math.max(12, window.innerHeight - pr.height - 12);
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
}

function closeSequence() {
    const panel = document.getElementById('seq-panel');
    const overlay = document.getElementById('seq-overlay');
    if (panel) panel.remove();
    if (overlay) overlay.remove();
}

async function saveClassOverride() {
    const p = pages[si];
    const newType = document.getElementById('ec-type').value.trim();
    const newCopy = document.getElementById('ec-copy').value;
    const notes = document.getElementById('ec-notes').value.trim();
    const status = document.getElementById('ec-status');
    const btn    = document.getElementById('ec-save-btn');
    if (!newType) {
        if (status) { status.textContent = 'Document type cannot be empty.'; status.style.color = '#dc2626'; }
        const inp = document.getElementById('ec-type');
        if (inp) inp.focus();
        return;
    }
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; btn.style.opacity = '0.7'; }
    if (status) { status.textContent = 'Applying classification…'; status.style.color = '#1554ca'; }
    const jobId = new URLSearchParams(location.search).get('job_id');
    try {
        const r = await fetch('/api/override/' + jobId + '/classification', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                packet_id: p.packet_id || 'pg_' + p.page_number,
                document_type: newType,
                copy_status: newCopy,
                notes: notes,
                page_number: p.page_number,
            })
        });
        if (r.ok) {
            _closeEditForm();
            // P198eq — pull a fresh page payload from the server so EVERY
            // panel (sidebar, toolbar, document-summary, packet-pages
            // breakdown) reflects the new classification, not just the
            // two locally-mutated fields. The override endpoint mirrors
            // step03/step08/step09 to in-memory cache, so this fetch
            // returns the post-edit state.
            try {
                const re = await fetch(`${API}/api/extracted-text/${jobId}?_=${Date.now()}`,
                    {cache:'no-store', headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
                if (re.ok) {
                    const dd = await re.json();
                    if (dd && Array.isArray(dd.pages)) {
                        pages = dd.pages;
                    }
                }
            } catch (_e) { /* fall through to local update */ }
            // Belt-and-braces: also patch local copy in case the refetch
            // failed (network blip etc.) — sel() below will render either way.
            const cur = pages[si];
            if (cur) {
                cur.document_type = newType;
                cur.copy_status   = newCopy;
            }
            rList();
            sel(si);
            // Close any open document-summary panel so it re-opens with
            // the refreshed data on next click instead of stale content.
            const _sp = document.getElementById('summary-panel');
            if (_sp) _sp.remove();
            const _so = document.getElementById('summary-overlay');
            if (_so) _so.remove();
            _ecShowToast('Classification updated — re-run verification to apply changes.', 'ok');
        } else {
            let detail = `${r.status}`;
            try { const j = await r.json(); if (j && (j.detail || j.error)) detail = j.detail || j.error; } catch(_) {}
            _ecShowToast('Save failed: ' + detail, 'error');
            if (btn) { btn.disabled = false; btn.textContent = 'Save & Apply'; btn.style.opacity = '1'; }
            if (status) { status.textContent = ''; }
        }
    } catch(err) {
        _ecShowToast('Network error: ' + (err && err.message ? err.message : err), 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Save & Apply'; btn.style.opacity = '1'; }
        if (status) { status.textContent = ''; }
    }
}

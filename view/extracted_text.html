<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracted Text - ComplyTrade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1e293b; }
        .header { background: linear-gradient(135deg, #1554ca 0%, #0f3a8e 100%); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.15em; display: inline; vertical-align: middle; }
        .layout { display: flex; height: calc(100vh - 48px); }

        /* Sidebar */
        .sidebar { width: 220px; min-width: 220px; background: #fff; border-right: 1px solid #dde3ed; display: flex; flex-direction: column; }
        .sb-head { padding: 10px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 700; font-size: 0.8em; color: #475569; display: flex; justify-content: space-between; }
        .sb-search { padding: 5px 8px; border-bottom: 1px solid #e2e8f0; }
        .sb-search input { width: 100%; padding: 4px 7px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.78em; outline: none; }
        .sb-search input:focus { border-color: #1554ca; }
        .pg-list { flex: 1; overflow-y: auto; }
        .pi { padding: 7px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; gap: 4px; transition: background 0.1s; }
        .pi:hover { background: #eff6ff; }
        .pi.active { background: #dbeafe; border-left: 3px solid #1554ca; }
        .pn { font-weight: 700; font-size: 0.85em; min-width: 16px; }
        .pb { font-size: 0.65em; color: #fff; background: #16a34a; padding: 1px 5px; border-radius: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
        .pb.lc { background: #2563eb; } .pb.amd { background: #7c3aed; } .pb.vlm { background: #d97706; font-size: 0.6em; }
        .pc { font-size: 0.68em; color: #94a3b8; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Stats row */
        .stats { display: flex; gap: 0; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .st { flex: 1; text-align: center; padding: 10px 8px; border-right: 1px solid #f1f5f9; }
        .st:last-child { border-right: none; }
        .sv { font-size: 1.2em; font-weight: 800; }
        .sv.v1 { color: #1554ca; } .sv.v2 { color: #1e293b; } .sv.v3 { color: #d97706; } .sv.v4 { color: #16a34a; }
        .sl { font-size: 0.7em; color: #64748b; }

        /* Toolbar — single row */
        .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-wrap: nowrap; }
        .tabs { display: flex; gap: 0; }
        .tb { padding: 5px 12px; cursor: pointer; font-size: 0.78em; font-weight: 600; color: #64748b; background: #fff; border: 1px solid #e2e8f0; transition: all 0.12s; }
        .tb:first-child { border-radius: 5px 0 0 5px; }
        .tb:last-child { border-radius: 0 5px 5px 0; }
        .tb + .tb { border-left: none; }
        .tb.active { color: #fff; background: #1554ca; border-color: #1554ca; }
        .tb.vt { color: #92400e; }
        .tb.vt.active { background: #d97706; border-color: #d97706; color: #fff; }
        .pg-info { font-size: 0.8em; color: #334155; font-weight: 700; }
        .pg-type-lbl { font-size: 0.75em; color: #64748b; }
        .badge-sm { padding: 1px 6px; border-radius: 6px; font-size: 0.68em; font-weight: 600; }
        .badge-orig { background: #dcfce7; color: #166534; }
        .badge-copy { background: #fef3c7; color: #92400e; }
        .badge-vlm { background: #fef3c7; color: #d97706; }
        .spacer { flex: 1; }
        .srch { display: flex; align-items: center; gap: 3px; }
        .srch input { padding: 4px 7px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.76em; width: 150px; outline: none; }
        .srch input:focus { border-color: #1554ca; }
        .si { font-size: 0.7em; color: #94a3b8; min-width: 50px; text-align: center; }
        .btn { background: #e2e8f0; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.74em; cursor: pointer; color: #475569; font-weight: 600; }
        .btn:hover { background: #cbd5e1; }
        .btn.ok { background: #dcfce7; color: #16a34a; }

        /* Content split */
        .content { flex: 1; display: flex; overflow: hidden; }

        /* Image pane */
        .img-pane { width: 40%; min-width: 200px; background: #1a1a2e; display: flex; flex-direction: column; position: relative; }
        .img-pane.hidden { display: none; }
        .img-toolbar { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: #0f0f23; justify-content: flex-end; }
        .img-toolbar .ibtn { background: rgba(255,255,255,0.1); border: none; color: #ccc; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 0.72em; font-weight: 600; }
        .img-toolbar .ibtn:hover { background: rgba(255,255,255,0.25); color: #fff; }
        .img-toolbar .ibtn.active { background: rgba(59,130,246,0.5); color: #fff; }
        .img-toolbar .sep { width: 1px; height: 16px; background: rgba(255,255,255,0.15); }
        .img-toolbar .zlbl { color: #888; font-size: 0.7em; min-width: 35px; text-align: center; }
        .img-wrap { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 8px; }
        .img-wrap img { transition: transform 0.15s; cursor: grab; max-width: 100%; }

        /* Resize handle */
        .rhandle { width: 4px; background: #334155; cursor: col-resize; flex-shrink: 0; }
        .rhandle:hover { background: #3b82f6; }

        /* Text pane */
        .txt-pane { flex: 1; display: flex; flex-direction: column; background: #fff; overflow: hidden; }
        .txt-pane.vlm-bg pre { background: #fffbeb; }
        .txt-tabs { display: flex; gap: 0; padding: 0 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; align-items: flex-end; }
        .txt-tabs .tb { margin-bottom: -1px; border-bottom: 2px solid transparent; border-radius: 0; border: none; background: none; padding: 8px 14px; }
        .txt-tabs .tb.active { border-bottom: 2px solid #1554ca; color: #1554ca; background: #fff; }
        .txt-tabs .tb.vt.active { border-bottom-color: #d97706; color: #d97706; }
        .txt-pane pre { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.8em; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #334155; flex: 1; overflow-y: auto; padding: 14px 18px; margin: 0; }

        mark { background: #fbbf24; padding: 0 1px; border-radius: 2px; }
        mark.cur { background: #f97316; color: #fff; }
        .no-sel { display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8; flex-direction: column; gap: 6px; font-size: 0.9em; }

        /* Summary tooltip panel */
        .summary-btn { background: linear-gradient(135deg, #1554ca, #0d3b8a); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.74em; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .summary-btn:hover { background: linear-gradient(135deg, #1a66e0, #0f4aa0); }
        .summary-btn svg { width: 13px; height: 13px; fill: currentColor; }
        .summary-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 999; }
        .summary-panel { position: fixed; z-index: 1000; background: #fff; border-radius: 10px; box-shadow: 0 8px 32px rgba(21,84,202,0.18), 0 2px 8px rgba(0,0,0,0.10); max-width: 480px; min-width: 320px; max-height: 70vh; overflow-y: auto; border: 1.5px solid #c7d6f5; }
        .summary-panel-hdr { background: linear-gradient(135deg, #1554ca 0%, #0d3b8a 100%); color: #fff; padding: 10px 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: space-between; }
        .summary-panel-hdr h3 { font-size: 0.88em; margin: 0; font-weight: 700; }
        .summary-panel-close { background: none; border: none; color: rgba(255,255,255,0.8); font-size: 1.1em; cursor: pointer; padding: 0 4px; line-height: 1; }
        .summary-panel-close:hover { color: #fff; }
        .summary-panel-body { padding: 12px 16px; }
        .summary-row { display: flex; padding: 5px 0; border-bottom: 1px solid #f1f5f9; gap: 8px; }
        .summary-row:last-child { border-bottom: none; }
        .summary-key { font-size: 0.76em; font-weight: 700; color: #1554ca; min-width: 100px; flex-shrink: 0; }
        .summary-val { font-size: 0.76em; color: #334155; word-break: break-word; white-space: pre-wrap; }
        .summary-empty { font-size: 0.82em; color: #94a3b8; padding: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div><img src="/logo.png" alt="" style="height:24px;margin-right:8px;vertical-align:middle"><h1>Extracted Text Viewer</h1></div>
        <div style="font-size:0.8em;opacity:0.8" id="ji"></div>
    </div>
    <div class="layout">
        <div class="sidebar">
            <div class="sb-head"><span>Pages</span><span id="pgC"></span></div>
            <div class="sb-search"><input id="sf" placeholder="Filter..." oninput="filterPg()"></div>
            <div class="pg-list" id="pl"></div>
        </div>
        <div class="main">
            <div class="stats" id="sts"></div>
            <div id="vw" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
                <div class="no-sel" id="ns">&#128196;<br>Select a page</div>
                <div id="tbw" style="display:none"><div class="toolbar" id="tb"></div></div>
                <div class="content" id="ct" style="display:none">
                    <div class="txt-pane" id="tp">
                        <div class="txt-tabs" id="ttabs"></div>
                        <pre id="tc"></pre>
                    </div>
                    <div class="rhandle" id="rh"></div>
                    <div class="img-pane" id="ip">
                        <div class="img-toolbar" id="it"></div>
                        <div class="img-wrap" id="iw"><img id="pi" src="" alt="Page"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
const P=new URLSearchParams(location.search),jobId=P.get('job_id'),API=location.origin;
let pages=[],si=-1,tab='final',zm=1,imgOn=true,hits=[],hi=-1,fit=true,rot=0;

function e(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}
function ct(t){const l=t.toLowerCase();return l==='lc'||l==='mt700'?'lc':l==='amendment'||l==='mt707'?'amd':'';}

async function init(){
    try{
        const r=await fetch(`${API}/api/extracted-text/${jobId}`);
        if(!r.ok)throw new Error(`Server ${r.status}`);
        const d=await r.json();pages=d.pages||[];
        document.getElementById('ji').textContent=`Job: ${jobId.substring(0,8)}... | ${d.total_pages} pages`;
        document.getElementById('pgC').textContent=d.total_pages;
        const vp=pages.filter(p=>p.vlm_added).length;
        document.getElementById('sts').innerHTML=`
            <div class="st"><div class="sv v1">${d.total_pages}</div><div class="sl">Pages</div></div>
            <div class="st"><div class="sv v2">${d.total_glm_chars.toLocaleString()}</div><div class="sl">GLM Chars</div></div>
            <div class="st"><div class="sv v3">${vp}</div><div class="sl">VLM Enhanced</div></div>
            <div class="st"><div class="sv v4">${d.total_final_chars.toLocaleString()}</div><div class="sl">Final Chars</div></div>`;
        rList();if(pages.length)sel(0);
    }catch(ex){document.getElementById('ns').innerHTML=`<div style="color:#dc2626">Error: ${ex.message}</div>`;}
}

function rList(){
    let h='';pages.forEach((p,i)=>{
        const dt=p.document_type||'Unknown',cls=ct(dt),vb=p.vlm_added?'<span class="pb vlm">VLM</span>':'';
        h+=`<div class="pi" id="p${i}" onclick="sel(${i})"><div style="display:flex;align-items:center;gap:5px"><span class="pn">${p.page_number}</span><span class="pb ${cls}">${e(dt)}</span>${vb}</div><span class="pc">${p.final_chars.toLocaleString()}</span></div>`;
    });document.getElementById('pl').innerHTML=h;
}

function filterPg(){
    const q=document.getElementById('sf').value.toLowerCase();
    document.querySelectorAll('.pi').forEach((el,i)=>{const p=pages[i];el.style.display=`page ${p.page_number} ${p.document_type||''}`.toLowerCase().includes(q)?'':'none';});
}

function sel(i){
    si=i;tab='final';hits=[];hi=-1;
    document.querySelectorAll('.pi').forEach(x=>x.classList.remove('active'));
    const el=document.getElementById(`p${i}`);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'});}
    const p=pages[i];
    document.getElementById('ns').style.display='none';
    document.getElementById('tbw').style.display='';
    document.getElementById('ct').style.display='flex';
    // Image — use w=800 for fast loading
    const img=document.getElementById('pi');
    img.src=`${API}/api/page-image/${jobId}/${p.page_number}?w=800`;
    img.style.transform='';img.style.maxWidth='100%';zm=1;fit=true;rot=0;
    // Image toolbar
    rImgBar();
    // Tabs above text pane
    const hc=p.cleaned_text&&p.cleaned_text!==p.raw_text,hv=p.vlm_additions&&p.vlm_additions.length>0;
    let tabs=`<div class="tb active" onclick="sTab('final',this)">Final</div><div class="tb" onclick="sTab('raw',this)">GLM Raw</div>`;
    if(hc)tabs+=`<div class="tb" onclick="sTab('cleaned',this)">Cleaned</div>`;
    if(hv)tabs+=`<div class="tb vt" onclick="sTab('vlm',this)">VLM Added</div>`;
    document.getElementById('ttabs').innerHTML=tabs;
    // Toolbar — page info + search + copy
    const cs=p.copy_status?`<span class="badge-sm ${p.copy_status==='original'?'badge-orig':'badge-copy'}">${e((p.copy_status||'').toUpperCase())}</span>`:'';
    const vb=hv?'<span class="badge-sm badge-vlm">VLM ENHANCED</span>':'';
    document.getElementById('tb').innerHTML=`
        <span class="pg-info">Page ${p.page_number}</span>
        <span class="pg-type-lbl" id="pg-type-display">${e(p.document_type||'')}</span>${cs}${vb}
        <button class="btn" onclick="toggleEditClass()" style="padding:2px 8px;font-size:.72em;background:#fef3c7;color:#92400e;border:1px solid #fde68a" title="Change classification">Edit</button>
        <button class="summary-btn" onclick="toggleSummary(event)" title="Show document summary"><svg viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>Summary</button>
        <button class="summary-btn" onclick="toggleStamps(event)" title="Show stamps &amp; signatures" style="background:linear-gradient(135deg,#7c3aed,#5b21b6)"><svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"/><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd"/></svg>Stamps</button>
        <span class="spacer"></span>
        <div class="srch"><input id="sin" placeholder="Search in text..." oninput="doS()" onkeydown="if(event.key==='Enter'){event.shiftKey?pH():nH()}"><span class="si" id="sif"></span><button class="btn" onclick="pH()" title="Prev">&#9650;</button><button class="btn" onclick="nH()" title="Next">&#9660;</button></div>
        <button class="btn" onclick="cpT(this)">Copy</button>
        ${!imgOn?'<button class="btn" onclick="togImg()" style="background:#dbeafe;color:#1554ca">Show Image</button>':''}`;
    showT();
}

function rImgBar(){
    document.getElementById('it').innerHTML=`
        <span class="zlbl" id="zl">${fit?'Fit':Math.round(zm*100)+'%'}</span>
        <button class="ibtn" onclick="zI(-0.15)" title="Zoom out">&#8722;</button>
        <button class="ibtn" onclick="zI(0.15)" title="Zoom in">&#43;</button>
        <div class="sep"></div>
        <button class="ibtn ${fit?'active':''}" onclick="zFit()">Fit</button>
        <button class="ibtn" onclick="z100()">100%</button>
        <button class="ibtn" onclick="z200()">200%</button>
        <div class="sep"></div>
        <button class="ibtn" onclick="rotL()" title="Rotate left">&#8634;</button>
        <button class="ibtn" onclick="rotR()" title="Rotate right">&#8635;</button>
        <div class="sep"></div>
        <button class="ibtn" onclick="fullImg()">Full Res</button>
        <button class="ibtn" onclick="togImg()">&#10005; Hide</button>`;
}

function sTab(t,btn){tab=t;hits=[];hi=-1;const sin=document.getElementById('sin');if(sin)sin.value='';document.getElementById('sif').textContent='';document.querySelectorAll('.tb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');showT();}

function showT(){
    const p=pages[si];if(!p)return;
    const tp=document.getElementById('tp');tp.className='txt-pane';
    let t='';
    switch(tab){case 'raw':t=p.raw_text||'';break;case 'cleaned':t=p.cleaned_text||'';break;case 'vlm':t=p.vlm_additions||'';tp.className='txt-pane vlm-bg';break;default:t=p.final_text||'';}
    document.getElementById('tc').innerHTML=e(t);
}

function gT(){const p=pages[si];if(!p)return '';switch(tab){case 'raw':return p.raw_text||'';case 'cleaned':return p.cleaned_text||'';case 'vlm':return p.vlm_additions||'';default:return p.final_text||'';}}

// Search
function doS(){
    const q=document.getElementById('sin').value;
    if(!q||q.length<2){hits=[];hi=-1;document.getElementById('sif').textContent='';showT();return;}
    const text=gT(),escaped=e(text);let cnt=0;
    const re=new RegExp(e(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    hits=[];
    const hl=escaped.replace(re,m=>{hits.push(cnt);return `<mark id="h${cnt++}">${m}</mark>`;});
    document.getElementById('tc').innerHTML=hl;
    document.getElementById('sif').textContent=cnt?`${cnt} found`:'None';
    if(cnt>0){hi=0;hCur();}else hi=-1;
}
function hCur(){document.querySelectorAll('mark.cur').forEach(m=>m.classList.remove('cur'));if(hi>=0){const el=document.getElementById(`h${hi}`);if(el){el.classList.add('cur');el.scrollIntoView({block:'center'});}document.getElementById('sif').textContent=`${hi+1}/${hits.length}`;}}
function nH(){if(hits.length){hi=(hi+1)%hits.length;hCur();}}
function pH(){if(hits.length){hi=(hi-1+hits.length)%hits.length;hCur();}}

// Copy
function cpT(btn){navigator.clipboard.writeText(gT()).then(()=>{btn.textContent='Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1200);});}

// Image controls
function zI(d){fit=false;zm=Math.max(0.2,Math.min(4,zm+d));applyZm();}
function zFit(){fit=true;zm=1;const img=document.getElementById('pi');img.style.maxWidth='100%';img.style.transform=rot?`rotate(${rot}deg)`:'';img.style.transformOrigin='center center';rImgBar();}
function z100(){fit=false;zm=1;applyZm();}
function z200(){fit=false;zm=2;applyZm();}
function applyZm(){const img=document.getElementById('pi');img.style.maxWidth='none';img.style.transform=`scale(${zm}) rotate(${rot}deg)`;img.style.transformOrigin='top left';rImgBar();}
function rotL(){rot=(rot-90)%360;fit?zFit():applyZm();}
function rotR(){rot=(rot+90)%360;fit?zFit():applyZm();}
function fullImg(){
    const p=pages[si];if(!p)return;
    const img=document.getElementById('pi');
    img.src=`${API}/api/page-image/${jobId}/${p.page_number}`;// no ?w= = full res
    fit=false;zm=1;applyZm();
}
function togImg(){
    imgOn=!imgOn;
    document.getElementById('ip').classList.toggle('hidden',!imgOn);
    document.getElementById('rh').style.display=imgOn?'':'none';
    if(imgOn)rImgBar();
    // Re-render toolbar to show/hide "Show Image" button
    if(si>=0)sel(si);
}

// Resize
(function(){
    const rh=document.getElementById('rh'),ip=document.getElementById('ip');let sx,sw;
    rh.addEventListener('mousedown',ev=>{sx=ev.clientX;sw=ip.offsetWidth;document.addEventListener('mousemove',mv);document.addEventListener('mouseup',()=>document.removeEventListener('mousemove',mv),{once:true});});
    function mv(ev){const w=sw+(ev.clientX-sx);if(w>120&&w<window.innerWidth*0.7)ip.style.width=w+'px';}
})();

// Keyboard
document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;if(ev.key==='ArrowDown'&&si<pages.length-1){sel(si+1);ev.preventDefault();}if(ev.key==='ArrowUp'&&si>0){sel(si-1);ev.preventDefault();}});

init();

// ── Classification Override ──
function toggleEditClass() {
    const p = pages[si];
    const el = document.getElementById('pg-type-display');
    if (document.getElementById('edit-class-form')) {
        // Already open — close it
        document.getElementById('edit-class-form').remove();
        return;
    }
    const form = document.createElement('div');
    form.id = 'edit-class-form';
    form.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:1000;min-width:350px';
    form.innerHTML = `
        <h3 style="margin-bottom:12px;font-size:1em;color:#1554ca">Edit Page ${p.page_number} Classification</h3>
        <div style="margin-bottom:10px">
            <label style="font-size:.82em;font-weight:600;display:block;margin-bottom:3px">Document Type</label>
            <input type="text" id="ec-type" value="${(p.document_type||'').replace(/"/g,'&quot;')}" style="width:100%;padding:8px;border:2px solid #e0e5ff;border-radius:6px;font-size:.9em">
        </div>
        <div style="margin-bottom:10px">
            <label style="font-size:.82em;font-weight:600;display:block;margin-bottom:3px">Copy Status</label>
            <select id="ec-copy" style="width:100%;padding:8px;border:2px solid #e0e5ff;border-radius:6px;font-size:.9em">
                <option value="original" ${p.copy_status==='original'?'selected':''}>Original</option>
                <option value="copy" ${p.copy_status==='copy'?'selected':''}>Copy</option>
                <option value="non_negotiable" ${p.copy_status==='non_negotiable'?'selected':''}>Non-Negotiable</option>
            </select>
        </div>
        <div style="margin-bottom:10px">
            <label style="font-size:.82em;font-weight:600;display:block;margin-bottom:3px">Notes</label>
            <input type="text" id="ec-notes" placeholder="Optional notes..." style="width:100%;padding:8px;border:2px solid #e0e5ff;border-radius:6px;font-size:.9em">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button onclick="document.getElementById('edit-class-form').remove()" style="padding:8px 16px;border:1px solid #ccc;border-radius:6px;background:#f5f5f5;cursor:pointer;font-weight:600">Cancel</button>
            <button onclick="saveClassOverride()" style="padding:8px 16px;border:none;border-radius:6px;background:#1554ca;color:#fff;cursor:pointer;font-weight:600">Save</button>
        </div>
    `;
    document.body.appendChild(form);
    document.getElementById('ec-type').focus();
    document.getElementById('ec-type').select();
}

// ── Summary Tooltip ──
function toggleSummary(evt) {
    // Close if already open
    const existing = document.getElementById('summary-panel');
    if (existing) { closeSummary(); return; }
    const p = pages[si];
    if (!p) return;

    // Create overlay to catch outside clicks
    const overlay = document.createElement('div');
    overlay.className = 'summary-overlay';
    overlay.id = 'summary-overlay';
    overlay.onclick = closeSummary;
    document.body.appendChild(overlay);

    // Create panel
    const panel = document.createElement('div');
    panel.className = 'summary-panel';
    panel.id = 'summary-panel';

    // Header — show which pages of the packet contributed to this summary
    const packetPages = Array.isArray(p.packet_pages) && p.packet_pages.length
        ? p.packet_pages : [p.page_number];
    const pagesLabel = packetPages.length > 1
        ? `pages ${packetPages.join(', ')}`
        : `page ${p.page_number}`;
    const nPagesNote = packetPages.length > 1
        ? ` <span style="font-weight:400;opacity:.85;font-size:.9em">(summary built from <b>${packetPages.length} pages</b>: ${packetPages.join(', ')})</span>`
        : '';
    let html = `<div class="summary-panel-hdr"><h3>Document Summary — ${pagesLabel}${nPagesNote}</h3><button class="summary-panel-close" onclick="closeSummary()">&#10005;</button></div>`;

    // Body — parse the pipe-separated summary string or use vlm_summary dict
    html += '<div class="summary-panel-body">';

    // Reclassification banner — if Step 9 reclassified, show both types
    const curType = p.document_type || '';
    const origType = p.original_document_type || '';
    if (origType && origType.toLowerCase().trim() !== curType.toLowerCase().trim() && origType !== 'unknown') {
        html += `<div style="padding:6px 12px;font-size:.72em;background:#fef3c7;color:#78350f;border-bottom:1px solid #fde68a">
          <b>Reclassified:</b> document is <b>${e(curType)}</b>
          <span style="color:#555">(Step 3 originally classified as ${e(origType)}; Step 9 reconciled to current type).</span>
        </div>`;
    }

    // Multi-page coverage banner (inside body, for emphasis)
    if (packetPages.length > 1) {
        html += `<div style="padding:6px 12px;font-size:.72em;background:#e0f2fe;color:#075985;border-bottom:1px solid #bae6fd">
          <b>Multi-page document:</b> this ${packetPages.length}-page packet's summary was generated from ALL pages
          (${packetPages.join(', ')}). No page-1-only bias.
        </div>`;
    }
    const summaryStr = p.document_summary || '';
    const vlmSum = p.vlm_summary || {};
    const blSubtype = p.bl_subtype || null;
    const unifiedSum = p.unified_summary || {};
    let hasContent = false;

    // ── Step 3 BL Sub-type block (only for Bill of Lading pages) ──
    if (blSubtype && Object.keys(blSubtype).length > 0) {
        // Preferred order for readability; any other keys fall through at the bottom.
        const blOrder = [
            'bl_type_description',
            'form_type', 'contract_type', 'issuer_type', 'signing_type',
            'cleanness', 'is_claused_bl', 'clausing_notes',
            'shipped_on_board_status', 'negotiability', 'consigned_form',
            'freight_status',
            'has_terms_overleaf', 'is_blank_back',
            'is_short_form', 'is_house_bl', 'is_charter_party_bl',
            'carrier_name', 'forwarder_name',
        ];
        const prettyLabel = (k) => k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const fmtVal = (v) => {
            if (typeof v === 'boolean') return v ? 'Yes' : 'No';
            if (Array.isArray(v)) return v.join(', ');
            if (typeof v === 'object' && v !== null) return JSON.stringify(v);
            return String(v || '').replace(/_/g, ' ');
        };
        html += `<div style="padding:8px 12px;font-size:.76em;font-weight:700;color:#2c8a2c;background:#f0fdf4;border-bottom:1px solid #bbf7d0">BL Sub-type (Step 3d)</div>`;
        const renderedBL = new Set();
        const renderBL = (k, v) => {
            if (v === undefined || v === null || v === '' || v === 'unknown') return;
            // Skip purely false booleans unless it's a "cleanness/status" indicator worth
            // showing; keep True values and non-boolean values.
            if (typeof v === 'boolean' && v === false && !['has_terms_overleaf','is_blank_back'].includes(k)) return;
            html += `<div class="summary-row"><span class="summary-key">${e(prettyLabel(k))}</span><span class="summary-val">${e(fmtVal(v))}</span></div>`;
            hasContent = true;
            renderedBL.add(k);
        };
        // First pass: preferred order
        for (const k of blOrder) {
            if (k in blSubtype) renderBL(k, blSubtype[k]);
        }
        // Second pass: any other bl_subtype keys the prompt might invent
        for (const [k, v] of Object.entries(blSubtype)) {
            if (k.startsWith('_') || renderedBL.has(k)) continue;
            renderBL(k, v);
        }
    }

    // ── Step 3e Unified Summary block (all packets; rich BL fields when BL) ──
    if (Object.keys(unifiedSum).length > 0) {
        // Field display order; anything not here gets rendered at the bottom in raw order
        const preferredOrder = [
            'document_identifier','bl_number','bl_date','ntn_number','issue_date',
            'issuer','signed_by','shipper','consignee','notify_party',
            'drawer','drawee','payee',
            'goods_description','hs_codes','marks_and_numbers',
            'quantity','number_of_packages','package_type',
            'gross_weight','net_weight','measurement',
            'vessel_name','voyage_number','port_of_loading','port_of_discharge',
            'place_of_receipt','place_of_delivery','shipment_date','onboard_date',
            'container_numbers','seal_numbers','number_of_originals',
            'freight_terms','freight_amount','amount',
            'lc_reference','invoice_reference','contract_reference','charter_party_reference',
            'key_clauses','cross_references','notes',
        ];
        html += `<div style="padding:8px 12px;font-size:.76em;font-weight:700;color:#1554ca;background:#eff6ff;border-bottom:1px solid #bfdbfe">Packet Summary (Step 3e)</div>`;
        const rendered = new Set();
        // Unwrap an LLM-returned object into a readable string, preferring
        // common value fields — the LLM sometimes returns typed fields as
        // structured objects (e.g. {"role":"lc_reference","value":"...","raw":"..."})
        // instead of plain strings.
        const unwrapObj = (obj) => {
            if (!obj || typeof obj !== 'object') return String(obj || '');
            // Prefer: value > name > raw > in_words > any non-meta key
            const preferredKeys = ['value', 'name', 'text', 'raw', 'in_words', 'amount'];
            for (const k of preferredKeys) {
                if (obj[k]) {
                    const extra = [];
                    if (obj.currency && k !== 'raw') extra.push(obj.currency);
                    extra.push(String(obj[k]));
                    if (obj.unit) extra.push(String(obj.unit));
                    if (obj.in_words && k !== 'in_words') extra.push(`(${obj.in_words})`);
                    return extra.join(' ').trim();
                }
            }
            // Fallback: pretty key=value pairs, skipping role/meta keys
            return Object.entries(obj)
                .filter(([k, v]) => v && !['role','_error','_raw'].includes(k))
                .map(([k, v]) => `${k}=${v}`).join(', ');
        };
        const renderField = (key, val) => {
            if (val === undefined || val === null || val === '' || val === 'unknown') return;
            if (Array.isArray(val)) {
                if (val.length === 0) return;
                // Structured array (each item is {role, value, ...}) — handled below
                if (typeof val[0] === 'object') return;
                val = val.join(', ');
            } else if (typeof val === 'object') {
                val = unwrapObj(val);
            }
            const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            html += `<div class="summary-row"><span class="summary-key">${e(label)}</span><span class="summary-val">${e(String(val))}</span></div>`;
            hasContent = true;
            rendered.add(key);
        };

        // ── Structured arrays: dates / amounts / references / parties ──
        const renderStructuredArr = (key, items, formatter) => {
            if (!Array.isArray(items) || items.length === 0) return;
            const title = key.replace(/_found$/, '').replace(/\b\w/g, c => c.toUpperCase());
            html += `<div class="summary-row" style="background:#fafbff;padding:6px 0"><span class="summary-key" style="color:#0d3b8a">${e(title)} (${items.length})</span><span class="summary-val" style="display:block">`;
            items.forEach(it => {
                if (!it || typeof it !== 'object') return;
                html += `<div style="padding:2px 0;border-bottom:1px dotted #dbe5f5">${formatter(it)}</div>`;
            });
            html += `</span></div>`;
            hasContent = true;
            rendered.add(key);
        };
        // No substring truncation — show the FULL raw/address/in_words text.
        renderStructuredArr('dates_found', unifiedSum.dates_found, (d) => {
            const role = e((d.role || 'other').replace(/_/g, ' '));
            const val = e(d.value || d.raw || '');
            const raw = d.raw && d.raw !== d.value ? ` <span style="color:#888;font-size:.92em">— ${e(d.raw)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${val}${raw}`;
        });
        renderStructuredArr('amounts_found', unifiedSum.amounts_found, (a) => {
            const role = e((a.role || 'other').replace(/_/g, ' '));
            const cur = a.currency || '';
            const val = e(a.value || a.raw || '');
            const words = a.in_words ? ` <span style="color:#888;font-size:.92em">(${e(a.in_words)})</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${e(cur)} ${val}${words}`;
        });
        renderStructuredArr('quantities_found', unifiedSum.quantities_found, (q) => {
            const role = e((q.role || 'other').replace(/_/g, ' '));
            const val = e(q.value || q.raw || '');
            const unit = q.unit ? ` ${e(q.unit)}` : '';
            const raw = q.raw && q.raw !== q.value ? ` <span style="color:#888;font-size:.92em">— ${e(q.raw)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${val}${unit}${raw}`;
        });
        renderStructuredArr('references_found', unifiedSum.references_found, (r) => {
            const role = e((r.role || 'other').replace(/_/g, ' '));
            const val = e(r.value || r.raw || '');
            return `<b style="color:#1554ca">${role}:</b> ${val}`;
        });
        renderStructuredArr('parties_found', unifiedSum.parties_found, (p) => {
            const role = e((p.role || 'other').replace(/_/g, ' '));
            const name = e(p.name || p.raw || '');
            const addr = p.address ? ` <span style="color:#888;font-size:.9em">— ${e(p.address)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${name}${addr}`;
        });
        renderStructuredArr('other_details_found', unifiedSum.other_details_found, (o) => {
            const role = e((o.role || 'other').replace(/_/g, ' '));
            const val = e(o.value || o.raw || '');
            const raw = o.raw && o.raw !== o.value ? ` <span style="color:#888;font-size:.9em">— ${e(o.raw)}</span>` : '';
            return `<b style="color:#1554ca">${role}:</b> ${val}${raw}`;
        });

        for (const k of preferredOrder) {
            if (k in unifiedSum) renderField(k, unifiedSum[k]);
        }
        // Any other fields returned by the LLM that we didn't list above
        for (const [k, v] of Object.entries(unifiedSum)) {
            if (!rendered.has(k) && !k.startsWith('_')) renderField(k, v);
        }
    }

    if (Object.keys(vlmSum).length > 0) {
        // Structured summary from _vlm_summary
        // Show description paragraph first if available
        const desc = vlmSum.description || '';
        if (desc && desc.length > 5) {
            html += `<div style="padding:8px 12px;font-size:.82em;color:#333;line-height:1.5;border-bottom:1px solid #e5e7eb;background:#f8fafc">${e(desc)}</div>`;
            hasContent = true;
        }
        for (const [key, val] of Object.entries(vlmSum)) {
            if (key === 'description') continue;  // already shown above
            if (!val || String(val).trim() === '' || ['none','n/a','unknown','nil'].includes(String(val).trim().toLowerCase())) continue;
            const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            html += `<div class="summary-row"><span class="summary-key">${e(label)}</span><span class="summary-val">${e(String(val))}</span></div>`;
            hasContent = true;
        }
    } else if (summaryStr) {
        // Pipe-separated format: "Key: Value | Key: Value"
        const parts = summaryStr.split(' | ');
        for (const part of parts) {
            const colonIdx = part.indexOf(': ');
            if (colonIdx > 0) {
                const key = part.substring(0, colonIdx).trim();
                const val = part.substring(colonIdx + 2).trim();
                if (val && !['none','n/a','unknown','nil'].includes(val.toLowerCase())) {
                    html += `<div class="summary-row"><span class="summary-key">${e(key)}</span><span class="summary-val">${e(val)}</span></div>`;
                    hasContent = true;
                }
            }
        }
    }

    if (!hasContent) {
        html += '<div class="summary-empty">No summary available for this page.<br>Summary is generated during classification (Step 8).</div>';
    }
    html += '</div>';
    panel.innerHTML = html;

    // Position near the button
    document.body.appendChild(panel);
    const btnRect = evt.target.closest('.summary-btn').getBoundingClientRect();
    let top = btnRect.bottom + 6;
    let left = btnRect.left;
    // Keep within viewport
    const panelRect = panel.getBoundingClientRect();
    if (left + panelRect.width > window.innerWidth - 12) left = window.innerWidth - panelRect.width - 12;
    if (left < 12) left = 12;
    if (top + panelRect.height > window.innerHeight - 12) top = btnRect.top - panelRect.height - 6;
    panel.style.top = top + 'px';
    panel.style.left = left + 'px';
}

function closeSummary() {
    const panel = document.getElementById('summary-panel');
    const overlay = document.getElementById('summary-overlay');
    if (panel) panel.remove();
    if (overlay) overlay.remove();
}

function toggleStamps(evt) {
    const existing = document.getElementById('stamps-panel');
    if (existing) { closeStamps(); return; }
    const p = pages[si];
    if (!p) return;

    const overlay = document.createElement('div');
    overlay.className = 'summary-overlay';
    overlay.id = 'stamps-overlay';
    overlay.onclick = closeStamps;
    document.body.appendChild(overlay);

    const panel = document.createElement('div');
    panel.className = 'summary-panel';
    panel.id = 'stamps-panel';

    let html = `<div class="summary-panel-hdr" style="background:linear-gradient(135deg,#7c3aed,#5b21b6)"><h3>Stamps & Signatures — Page ${p.page_number}</h3><button class="summary-panel-close" onclick="closeStamps()">&#10005;</button></div>`;
    html += '<div class="summary-panel-body">';

    const info = p.stamps_info || {};
    const stamps = info.stamps || [];
    const signatures = info.signatures || [];
    const seals = info.seals || [];
    const logos = info.logos || [];
    let hasContent = false;

    if (stamps.length > 0) {
        html += '<div style="padding:6px 12px;font-size:.72em;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #f3f4f6">Stamps</div>';
        for (const s of stamps) {
            const text = (typeof s === 'string') ? s : (s.text || s.description || JSON.stringify(s));
            const type = (typeof s === 'object' && s.type) ? s.type : '';
            html += `<div class="summary-row"><span class="summary-key">${e(type || 'Stamp')}</span><span class="summary-val">${e(text)}</span></div>`;
            hasContent = true;
        }
    }

    if (signatures.length > 0) {
        html += '<div style="padding:6px 12px;font-size:.72em;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #f3f4f6">Signatures</div>';
        for (const s of signatures) {
            const desc = (typeof s === 'string') ? s : (s.description || s.text || JSON.stringify(s));
            const type = (typeof s === 'object' && s.type) ? s.type : '';
            html += `<div class="summary-row"><span class="summary-key">${e(type || 'Signature')}</span><span class="summary-val">${e(desc)}</span></div>`;
            hasContent = true;
        }
    }

    if (seals.length > 0) {
        html += '<div style="padding:6px 12px;font-size:.72em;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #f3f4f6">Seals</div>';
        for (const s of seals) {
            const desc = (typeof s === 'string') ? s : (s.description || JSON.stringify(s));
            html += `<div class="summary-row"><span class="summary-key">Seal</span><span class="summary-val">${e(desc)}</span></div>`;
            hasContent = true;
        }
    }

    if (logos.length > 0) {
        html += '<div style="padding:6px 12px;font-size:.72em;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #f3f4f6">Logos</div>';
        for (const s of logos) {
            const name = (typeof s === 'string') ? s : (s.company_name || s.description || JSON.stringify(s));
            html += `<div class="summary-row"><span class="summary-key">Logo</span><span class="summary-val">${e(name)}</span></div>`;
            hasContent = true;
        }
    }

    if (!hasContent) {
        html += '<div class="summary-empty">No stamps or signatures detected on this page.<br>Visual elements are extracted during classification (Step 8).</div>';
    }
    html += '</div>';
    panel.innerHTML = html;

    document.body.appendChild(panel);
    const rect = evt.target.closest('button').getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + 280 > window.innerWidth) left = window.innerWidth - 290;
    if (top + 300 > window.innerHeight) top = rect.top - 306;
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
}

function closeStamps() {
    const panel = document.getElementById('stamps-panel');
    const overlay = document.getElementById('stamps-overlay');
    if (panel) panel.remove();
    if (overlay) overlay.remove();
}

async function saveClassOverride() {
    const p = pages[si];
    const newType = document.getElementById('ec-type').value.trim();
    const newCopy = document.getElementById('ec-copy').value;
    const notes = document.getElementById('ec-notes').value.trim();
    if (!newType) return;
    const jobId = new URLSearchParams(location.search).get('job_id');
    try {
        const r = await fetch('/api/override/' + jobId + '/classification', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                packet_id: p.packet_id || 'pg_' + p.page_number,
                document_type: newType,
                copy_status: newCopy,
                notes: notes,
                page_number: p.page_number,
            })
        });
        if (r.ok) {
            // Update local data
            p.document_type = newType;
            p.copy_status = newCopy;
            // Refresh sidebar and toolbar
            rList();
            sel(si);
            document.getElementById('edit-class-form').remove();
            alert('Classification updated. Re-run verification to apply changes.');
        } else {
            alert('Save failed: ' + r.status);
        }
    } catch(err) {
        alert('Error: ' + err.message);
    }
}

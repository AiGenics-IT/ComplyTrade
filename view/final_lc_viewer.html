<!DOCTYPE html>

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1e293b; }

        .field-value textarea:focus { outline: none; border-color: #1554ca; box-shadow: 0 0 0 2px rgba(21,84,202,0.15); }

        .amended-pill { display: inline-block; font-size: 0.62em; font-weight: 800; padding: 1px 7px; border-radius: 10px; background: #fef3c7; color: #92400e; border: 1px solid #fde68a; letter-spacing: 0.04em; vertical-align: middle; margin-left: 6px; text-transform: uppercase; cursor: help; }
        .amended-pill .amend-tt { display: none; }   /* never inline-render */
        #globalAmendTt { display: none; position: fixed; z-index: 9999; background: #1e293b; color: #f1f5f9; border: 1px solid #475569; border-radius: 8px; padding: 14px 16px; min-width: 460px; max-width: 720px; max-height: 540px; overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 10px 25px rgba(0,0,0,0.4); font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; line-height: 1.55; text-align: left; white-space: normal; cursor: text; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #globalAmendTt.show { display: block; }

        #globalAmendTt .amend-block .new { color: #86efac; font-family: 'Fira Code', Consolas, monospace; font-size: 13px; padding: 5px 9px; background: #122; border-left: 3px solid #22c55e; border-radius: 3px; margin: 3px 0; word-break: break-word; white-space: pre-wrap; }
        .clause-row.amended-clause { background: linear-gradient(90deg, #fffbeb, #fef9c3) !important; border-left: 3px solid #f59e0b; }
        .clause-row { padding: 12px 20px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 12px; }
        .clause-row:nth-child(even) { background: #f8fafc; }
        .clause-num { width: 40px; font-weight: 700; color: #1554ca; flex-shrink: 0; padding-top: 6px; }
        .clause-text { flex: 1; }
        .clause-text textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 10px; font-family: inherit; font-size: 0.88em; resize: vertical; min-height: 60px; line-height: 1.5; }

<body>
    <div id="globalAmendTt"></div>
    <div class="header">
        <div>
            <img src="/logo.png" alt="AiGenics" style="height:35px;margin-right:15px;vertical-align:middle;">

            <button class="btn-reset" onclick="regenerateLC()" title="Re-extract Final LC from SWIFT messages and amendments" style="background:#7c3aed;color:white">Regenerate FLC</button>

    <!-- Styled modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <div class="modal-hdr" id="modal-hdr"><svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg><span id="modal-title">Title</span></div>
            <div class="modal-body" id="modal-body"></div>

        </div>

<script>
const params = new URLSearchParams(window.location.search);
const jobId = params.get('job_id');
const lcNumber = params.get('lc');
const API = window.location.origin;

// ── Styled modal system ──
function showModal(title, body, buttons, type) {
    const overlay = document.getElementById('modal-overlay');
    const hdr = document.getElementById('modal-hdr');
    const icons = {
        info: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>',
        warn: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>',
        error: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>',
        success: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>',
    };
    hdr.className = 'modal-hdr' + (type && type !== 'info' ? ' ' + type : '');
    hdr.innerHTML = (icons[type] || icons.info) + '<span>' + title + '</span>';
    document.getElementById('modal-body').innerHTML = body;
    let footerHtml = '';
    for (const btn of buttons) {
        footerHtml += `<button class="modal-btn ${btn.cls || 'modal-btn-primary'}" onclick="${btn.onclick}">${btn.label}</button>`;
    }
    document.getElementById('modal-footer').innerHTML = footerHtml;
    overlay.classList.add('active');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }
function showSuccess(title, msg) { showModal(title, msg, [{label:'OK', onclick:'closeModal()', cls:'modal-btn-primary'}], 'success'); }
function showError(title, msg) { showModal(title, msg, [{label:'OK', onclick:'closeModal()', cls:'modal-btn-cancel'}], 'error'); }
function showLoading(title, msg) { showModal(title, '<div style="text-align:center"><span class="modal-spinner"></span>' + msg + '</div>', [], 'info'); }
let originalData = {};
let modifiedFields = {};
let changeCount = 0;
let amendedFields = [];
let amendmentLog = [];

const TAG_NAMES = {
    '20':'Documentary Credit Number',
    '21':'Documentary Credit Number',
    '23':'Reference to Pre-Advice',
    '26E':'Number of Amendment',
    '27':'Sequence of Total',
    '30':'Date',
    '31C':'Date of Issue',
    '31D':'Date and Place of Expiry',
    '31E':'New Date of Expiry',
    '32B':'Currency Code, Amount',
    '32C':'Increase / Decrease of Amount',
    '33B':'Additional Amount Covered',
    '34B':'New Documentary Credit Amount',
    '39A':'Percentage Credit Amount Tolerance',
    '39B':'Maximum Credit Amount',
    '39C':'Additional Amounts Covered',
    '40A':'Form of Documentary Credit',
    '40E':'Applicable Rules',
    '41A':'Available With / By',
    '41D':'Available With / By',
    '42A':'Drawee',
    '42C':'Drafts at',
    '42D':'Drawee',
    '42M':'Mixed Payment Details',
    '42P':'Negotiation / Deferred Payment Details',
    '43P':'Partial Shipments',
    '43T':'Transshipment',
    '44A':'Place of Taking in Charge / Dispatch / Receipt',
    '44B':'Place of Final Destination / Delivery',
    '44C':'Latest Date of Shipment',
    '44D':'Shipment Period',
    '44E':'Port of Loading / Airport of Departure',
    '44F':'Port of Discharge / Airport of Destination',
    '45A':'Description of Goods and/or Services',
    '45B':'Description of Goods (Amendment)',
    '46A':'Documents Required',
    '46B':'Documents Required (Amendment)',
    '47A':'Additional Conditions',
    '47B':'Additional Conditions (Amendment)',
    '48':'Period for Presentation',
    '49':'Confirmation Instructions',
    '49G':'Special Payment Conditions for Beneficiary',
    '49H':'Special Payment Conditions for Bank',
    '49M':'Mixed Payment Details',
    '49N':'Negotiation / Deferred Payment Details',
    '50':'Applicant',
    '50B':'Non-Bank Issuer',
    '50C':'Applicant',
    '50G':'Applicant',
    '50H':'Applicant',
    '50N':'Applicant',
    '51A':'Applicant Bank',
    '51D':'Applicant Bank',
    '52A':'Issuing Bank',
    '52B':'Issuing Bank',
    '52D':'Issuing Bank',
    '53A':'Reimbursing Bank',
    '53B':'Reimbursing Bank',
    '53D':'Reimbursing Bank',
    '54A':"Reimbursing Bank's Correspondent",
    '54B':"Reimbursing Bank's Correspondent",
    '54D':"Reimbursing Bank's Correspondent",
    '56A':'Intermediary Bank',
    '56C':'Intermediary Bank',
    '56D':'Intermediary Bank',
    '57A':'Advise Through Bank',
    '57B':'Advise Through Bank',
    '57C':'Advise Through Bank',
    '57D':'Advise Through Bank',
    '58A':'Requested Confirmation Party',
    '58B':'Requested Confirmation Party',
    '58D':'Requested Confirmation Party',
    '59':'Beneficiary',
    '59A':'Beneficiary',
    '59F':'Beneficiary',
    '71A':'Details of Charges',
    '71B':'Charges',
    '71D':'Charges',
    '72':'Sender to Receiver Information',
    '72Z':'Sender to Receiver Information',
    '73':'General Information',
    '77A':'Delivery of Documents and Settlement',
    '77J':'Reimbursement Conditions',
    '78':'Instructions to the Paying / Accepting / Negotiating Bank',
    '79':'Narrative',
};

const CLAUSE_FIELDS = new Set(['45A','46A','47A','46B','47B','45B','78','79','72']);

async function loadData() {
    try {
        const r = await fetch(`${API}/api/result/${jobId}`);
        const data = await r.json();
        if (!data.consolidated_lcs || !data.consolidated_lcs.length) {
            document.getElementById('content').innerHTML = '<div class="loading">No Final LC data found.</div>';
            return;
        }
        const lc = data.consolidated_lcs.find(l => l.lc_number === lcNumber) || data.consolidated_lcs[0];
        const cf = (lc.data || lc).consolidated_fields || lc.consolidated_fields || {};
        amendedFields = cf._amended_fields || [];
        amendmentLog = (lc.data && lc.data.amendment_log) || lc.amendment_log || [];
        const clauses = {};

        // Separate standalone fields from clause fields
        const standaloneFields = {};
        for (const [tag, val] of Object.entries(cf)) {
            if (CLAUSE_FIELDS.has(tag)) {
                // Will be handled from clauses
            } else {
                standaloneFields[tag] = typeof val === 'string' ? val : JSON.stringify(val);
            }
        }

        // Get clauses from the LC data (from Step 6)
        // The clauses might be in consolidated_fields as arrays or in a separate clauses dict
        for (const tag of CLAUSE_FIELDS) {
            const val = cf[tag];
            if (Array.isArray(val)) {
                clauses[tag] = val;
            } else if (typeof val === 'string' && val.trim()) {
                clauses[tag] = [val];
            }
        }

        originalData = { standaloneFields, clauses };
        document.getElementById('dcNum').textContent = 'DC: ' + (lc.lc_number || lc.dc_number || cf['20'] || '');
        renderLC(standaloneFields, clauses);
    } catch(e) {
        document.getElementById('content').innerHTML = `<div class="loading">Error: ${e.message}</div>`;
    }
}

function splitClauses(text) {
    // Split a multi-clause field (45A/46A/47A/78/79) into numbered
    // clauses keyed by their number. Recognises forms "1)", "1.", "(1)".
    // Returns { '1': '...', '2': '...', ... } and also a `_preamble`
    // for any leading prose before the first numbered clause.
    const out = {};
    if (!text) return out;
    const norm = (text + '').replace(/\r\n/g, '\n').trim();
    const re = /(?:^|\n)\s*\(?(\d{1,3})[\)\.]\s+([\s\S]*?)(?=(?:\n\s*\(?\d{1,3}[\)\.]\s+)|$)/g;
    let m;
    let firstStart = -1;
    while ((m = re.exec(norm)) !== null) {
        if (firstStart === -1) firstStart = m.index;
        const num = m[1];
        const body = m[2].replace(/\s+/g, ' ').trim();
        out[num] = body;
    }
    if (firstStart > 0) {
        const preamble = norm.slice(0, firstStart).replace(/\s+/g, ' ').trim();
        if (preamble) out._preamble = preamble;
    } else if (firstStart === -1) {
        const all = norm.replace(/\s+/g, ' ').trim();
        if (all) out._preamble = all;
    }
    return out;
}

function diffClauses(oldText, newText) {
    // Try clause-by-clause diff first. Falls back to line-by-line.
    // Returns { mode: 'clause' | 'line' | 'whole',
    //          changed: [{n, oldText, newText, status}],
    //          removed: [...lines], added: [...lines] }
    const o = splitClauses(oldText);
    const n = splitClauses(newText);
    const oKeys = Object.keys(o).filter(k => k !== '_preamble');
    const nKeys = Object.keys(n).filter(k => k !== '_preamble');

    if (oKeys.length || nKeys.length) {
        const allKeys = Array.from(new Set([...oKeys, ...nKeys]))
            .sort((a, b) => parseInt(a) - parseInt(b));
        const changed = [];
        for (const k of allKeys) {
            const ov = o[k] || '';
            const nv = n[k] || '';
            if (ov === nv) continue;
            let status;
            if (!ov && nv) status = 'added';
            else if (ov && !nv) status = 'removed';
            else status = 'modified';
            changed.push({ n: k, oldText: ov, newText: nv, status });
        }
        // Preamble change?
        if ((o._preamble || '') !== (n._preamble || '')) {
            changed.unshift({
                n: 'preamble',
                oldText: o._preamble || '',
                newText: n._preamble || '',
                status: !o._preamble ? 'added' : (!n._preamble ? 'removed' : 'modified'),
            });
        }
        if (changed.length) return { mode: 'clause', changed };
    }

    // Line-by-line fallback (no recognisable clause numbering)
    const norm = s => (s || '').split(/\r?\n/)
        .map(l => l.replace(/\s+/g, ' ').trim())
        .filter(l => l);
    const oldLines = norm(oldText);
    const newLines = norm(newText);
    const newCounts = {};
    for (const l of newLines) newCounts[l] = (newCounts[l] || 0) + 1;
    const removed = [];
    for (const l of oldLines) {
        if ((newCounts[l] || 0) > 0) newCounts[l]--;
        else removed.push(l);
    }
    const oldCounts = {};
    for (const l of oldLines) oldCounts[l] = (oldCounts[l] || 0) + 1;
    const added = [];
    for (const l of newLines) {
        if ((oldCounts[l] || 0) > 0) oldCounts[l]--;
        else added.push(l);
    }
    if (removed.length || added.length) return { mode: 'line', removed, added };

    // Nothing useful at line level — fall back to whole-field
    return { mode: 'whole' };
}

function cleanAmendDate(raw) {
    // Strip 'Date of Amendment\n' label and SWIFT YYMMDD prefix if
    // present. "Date of Amendment\n251230 2025 Dec 30" -> "30-Dec-2025"
    if (!raw) return '';
    let s = String(raw).replace(/^[^\d]*Date\s+of\s+Amendment\s*[:\n]?\s*/i, '');
    s = s.replace(/^\d{6}\s+/, '');  // drop SWIFT YYMMDD prefix
    s = s.replace(/\s+/g, ' ').trim();
    // "2025 Dec 30" -> "30-Dec-2025"
    const m = s.match(/^(\d{4})\s+([A-Za-z]+)\s+(\d{1,2})$/);
    if (m) return `${m[3].padStart(2,'0')}-${m[2]}-${m[1]}`;
    return s;
}

function buildAmendTooltip(tag) {
    const blocks = [];
    for (const rec of (amendmentLog || [])) {
        const fields = rec.fields_changed || [];
        if (!fields.includes(tag)) continue;
        const det = (rec.change_details || {})[tag] || {};
        const old_v = det.old !== undefined ? String(det.old) : '';
        const new_v = det.new !== undefined ? String(det.new) : '';
        const num = rec.amendment_number || '?';
        const dt  = cleanAmendDate(rec.amendment_date || '');
        const diff = diffClauses(old_v, new_v);

        let block = `<div class="amend-block">`;
        block += `<div class="hd"><b>Amendment #${esc(String(num))}</b>`;
        if (dt) block += ` &middot; ${esc(dt)}`;
        block += `</div>`;

        // SWIFT operation tokens (DELETE / ADD / REPLACE / REPALL)
        const ops = det.ops || [];
        if (ops.length) {
            const opsText = ops.map(o => {
                const verb = (o.op || '').toUpperCase();
                return o.target ? `${verb} ${o.target}` : verb;
            }).join(' &middot; ');
            block += `<div class="ops-line">Operations: ${opsText}</div>`;
        }

        if (diff.mode === 'clause') {
            for (const c of diff.changed) {
                const label = (c.n === 'preamble') ? 'Preamble' : `Clause ${c.n}`;
                if (c.status === 'added') {
                    block += `<div class="hd">${label} &mdash; Added</div>`;
                    block += `<div class="diff-pane"><div class="new">${esc(c.newText)}</div></div>`;
                } else if (c.status === 'removed') {
                    block += `<div class="hd">${label} &mdash; Removed</div>`;
                    block += `<div class="diff-pane"><div class="old">${esc(c.oldText)}</div></div>`;
                } else {
                    block += `<div class="hd">${label} &mdash; Modified</div>`;
                    block += `<div class="diff-pane">`;
                    block += `<div class="old">${esc(c.oldText)}</div>`;
                    block += `<div class="new">${esc(c.newText)}</div>`;
                    block += `</div>`;
                }
            }
        } else if (diff.mode === 'line') {
            if (diff.removed.length) {
                block += `<div class="hd">Removed</div><div class="diff-pane">`;
                for (const l of diff.removed) block += `<div class="old">${esc(l)}</div>`;
                block += `</div>`;
            }
            if (diff.added.length) {
                block += `<div class="hd">Added</div><div class="diff-pane">`;
                for (const l of diff.added) block += `<div class="new">${esc(l)}</div>`;
                block += `</div>`;
            }
        } else {
            // mode === 'whole' — old/new are identical (or both empty)
            if (!old_v && new_v) {
                block += `<div class="hd">Added</div><div class="diff-pane"><div class="new">${esc(new_v)}</div></div>`;
            } else if (old_v && !new_v) {
                block += `<div class="hd">Removed</div><div class="diff-pane"><div class="old">${esc(old_v)}</div></div>`;
            } else if (old_v && new_v && old_v === new_v) {
                // Likely a stale truncated audit record — show full
                // Before/After so the user sees what was captured.
                block += `<div class="hd" style="color:#fbbf24">Audit captured identical values (regenerate FLC for fresh diff)</div>`;
                block += `<div class="hd">Before</div><div class="diff-pane"><div class="old">${esc(old_v)}</div></div>`;
                block += `<div class="hd">After</div><div class="diff-pane"><div class="new">${esc(new_v)}</div></div>`;
            } else {
                block += `<div class="hd" style="color:#94a3b8">No textual change recorded</div>`;
            }
        }
        block += `</div>`;
        blocks.push(block);
    }
    if (!blocks.length) {
        return `<div class="amend-tt"><h4>Amended</h4><div>No detailed audit available.</div></div>`;
    }
    return `<div class="amend-tt"><h4>Amendment History &mdash; Field ${esc(tag)}</h4>${blocks.join('')}</div>`;
}

// Portal-rendered tooltip — escapes any clipping ancestor
// (e.g. .section { overflow: hidden }) by living at body level.
let _ttHideTimer = null;
document.addEventListener('mouseover', (e) => {
    const pill = e.target.closest('.amended-pill');
    const inGtt = e.target.closest('#globalAmendTt');
    if (pill) {
        clearTimeout(_ttHideTimer);
        const inner = pill.querySelector('.amend-tt');
        const gtt = document.getElementById('globalAmendTt');
        if (!inner || !gtt) return;
        gtt.innerHTML = inner.innerHTML;
        const r = pill.getBoundingClientRect();
        // Position below the pill, clamp to viewport.
        const ttW = 720, ttH = 540;
        let left = Math.max(8, r.left);
        if (left + ttW > window.innerWidth - 8)
            left = Math.max(8, window.innerWidth - ttW - 8);
        let top = r.bottom + 4;
        if (top + ttH > window.innerHeight - 8)
            top = Math.max(8, r.top - ttH - 4);
        gtt.style.left = left + 'px';
        gtt.style.top = top + 'px';
        gtt.classList.add('show');
    } else if (inGtt) {
        clearTimeout(_ttHideTimer);
    }
});
document.addEventListener('mouseout', (e) => {
    const pill = e.target.closest('.amended-pill');
    const inGtt = e.target.closest('#globalAmendTt');
    if (!pill && !inGtt) return;
    // Only hide if the relatedTarget is neither pill nor tooltip
    const to = e.relatedTarget;
    if (to && (to.closest('.amended-pill') || to.closest('#globalAmendTt'))) return;
    clearTimeout(_ttHideTimer);
    _ttHideTimer = setTimeout(() => {
        const gtt = document.getElementById('globalAmendTt');
        if (gtt) gtt.classList.remove('show');
    }, 180);
});

function renderLC(fields, clauses) {
    let html = '';

    // LC Details section
    html += '<div class="section">';
    html += '<div class="section-header" onclick="toggleSection(this)"><span>LC Details</span><span class="toggle">-</span></div>';
    html += '<div class="section-body">';
    const sortedTags = Object.keys(fields).sort((a,b) => {
        const na = parseInt(a) || 999, nb = parseInt(b) || 999;
        return na - nb;
    });
    for (const tag of sortedTags) {
        if (tag === '_amended_fields') continue;
        const name = TAG_NAMES[tag] || tag;
        const val = fields[tag] || '';
        const rows = Math.max(1, Math.ceil(val.length / 80));
        const isAmended = amendedFields.includes(tag);
        const _pill = isAmended
            ? ` <span class="amended-pill">AMENDED${buildAmendTooltip(tag)}</span>`
            : '';
        html += `<div class="field-row${isAmended ? ' amended-row' : ''}">
            <div class="field-tag">${tag}${_pill}</div>
            <div class="field-name">${esc(name)}</div>
            <div class="field-value">
                <textarea id="field_${tag}" rows="${rows}" onchange="markModified('field_${tag}','${tag}')">${esc(val)}</textarea>
            </div>
        </div>`;
    }
    html += '</div></div>';

    // Clause sections
    for (const [tag, clauseList] of Object.entries(clauses)) {
        if (!clauseList || !clauseList.length) continue;
        const name = TAG_NAMES[tag] || tag;
        const isAmended = amendedFields.includes(tag);
        html += '<div class="section">';
        const _sectionPill = isAmended
            ? ` <span class="amended-pill" style="font-size:.7em">AMENDED${buildAmendTooltip(tag)}</span>`
            : '';
        html += `<div class="section-header" onclick="toggleSection(this)"><span>Field ${tag}: ${esc(name)}${_sectionPill}</span><span class="toggle">-</span></div>`;
        html += '<div class="section-body">';
        for (let i = 0; i < clauseList.length; i++) {
            const clause = clauseList[i];
            const text = typeof clause === 'string' ? clause : (clause.text || JSON.stringify(clause));
            const clauseAmended = isAmended || (typeof clause === 'object' && clause.amended);
            const rows = Math.max(2, Math.ceil(text.length / 80));
            html += `<div class="clause-row${clauseAmended ? ' amended-clause' : ''}">
                <div class="clause-num">${i+1}.</div>
                <div class="clause-text">
                    <textarea id="clause_${tag}_${i}" rows="${rows}" onchange="markModified('clause_${tag}_${i}','${tag}',${i})">${esc(text)}</textarea>
                </div>
            </div>`;
        }
        html += '</div></div>';
    }

    document.getElementById('content').innerHTML = html;
}

function toggleSection(header) {
    const body = header.nextElementSibling;
    const toggle = header.querySelector('.toggle');
    if (body.style.display === 'none') {
        body.style.display = '';
        toggle.textContent = '-';
    } else {
        body.style.display = 'none';
        toggle.textContent = '+';
    }
}

function markModified(elemId, tag, clauseIdx) {
    const el = document.getElementById(elemId);
    el.classList.add('modified');
    modifiedFields[elemId] = { tag, clauseIdx, value: el.value };
    changeCount = Object.keys(modifiedFields).length;
    document.getElementById('changeCount').textContent = changeCount + ' change(s) pending';
}

function resetAll() {
    showModal('Reset Changes', 'Discard all unsaved edits and reload the original data?',
        [
            {label: 'Cancel', onclick: 'closeModal()', cls: 'modal-btn-cancel'},
            {label: 'Reset', onclick: 'doReset()', cls: 'modal-btn-danger'},
        ], 'warn');
}
function doReset() {
    closeModal();
    loadData();
    modifiedFields = {};
    changeCount = 0;
    document.getElementById('changeCount').textContent = 'No changes';
}

function regenerateLC() {
    showModal('Regenerate Final LC',
        'This will re-extract all fields from the LC and amendments using the AI model, overwriting any manual edits.' +
        '<div class="detail">Steps 6-9 will be re-run. Steps 1-3 (OCR) are preserved.</div>',
        [
            {label: 'Cancel', onclick: 'closeModal()', cls: 'modal-btn-cancel'},
            {label: 'Regenerate', onclick: 'doRegenerate()', cls: 'modal-btn-primary'},
        ], 'warn');
}
async function doRegenerate() {
    // Show loading modal with log window
    showModal('Regenerating Final LC',
        '<div style="text-align:center;margin-bottom:12px"><span class="modal-spinner"></span> Applying amendments via AI model...</div>' +
        '<div id="regen-log" style="background:#0f172a;color:#94a3b8;font-family:Cascadia Code,Fira Code,monospace;font-size:.75em;padding:10px 12px;border-radius:6px;max-height:250px;overflow-y:auto;line-height:1.6;white-space:pre-wrap"></div>',
        [], 'info');
    const logEl = document.getElementById('regen-log');
    function addLog(msg) { if(logEl) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; } }
    addLog('Starting regeneration...');

    const jobId = new URLSearchParams(location.search).get('job_id');
    const startTime = Date.now();

    // Start SSE log stream
    const evtSource = new EventSource(`/api/regenerate-logs/${jobId}`);
    evtSource.onmessage = (e) => {
        try {
            const d = JSON.parse(e.data);
            if (d.log) addLog(d.log);
            if (d.done) evtSource.close();
        } catch(ex) {}
    };
    evtSource.onerror = () => { evtSource.close(); };

    try {
        addLog('Sending request to server...');
        const startResp = await fetch(`/api/regenerate-final-lc/${jobId}`, {method: 'POST'});
        const startData = await startResp.json();
        if (startData.status !== 'started') {
            evtSource.close();
            showError('Regeneration Failed', startData.error || startData.detail || 'Could not start');
            return;
        }
        addLog('Server processing started...');

        // Poll for result
        const pollResult = async () => {
            while (true) {
                await new Promise(r => setTimeout(r, 2000));
                try {
                    const r = await fetch(`/api/regenerate-result/${jobId}`);
                    const d = await r.json();
                    if (d.status === 'ok') {
                        evtSource.close();
                        addLog(`Completed in ${Math.round((Date.now() - startTime) / 1000)}s`);
                        modifiedFields = {};
                        changeCount = 0;
                        loadData();
                        showSuccess('Regeneration Complete',
                            `Final LC has been regenerated successfully.` +
                            `<div class="detail">DC Number: <b>${d.dc_number || '—'}</b><br>` +
                            `Fields: <b>${d.total_fields || '—'}</b><br>` +
                            `Amendments Applied: <b>${d.amendment_count || '0'}</b></div>`);
                        return;
                    } else if (d.status === 'in_progress') {
                        continue;
                    } else {
                        evtSource.close();
                        loadData();
                        showError('Regeneration Failed', d.error || d.message || 'Unknown error');
                        return;
                    }
                } catch(e) { continue; }
            }
        };
        await pollResult();
    } catch (err) {
        evtSource.close();
        loadData();
        showError('Regeneration Failed', 'Could not connect to the server.<div class="detail">' + err.message + '</div>');
    }
}

async function saveChanges() {
    if (changeCount === 0) { showModal('No Changes', 'There are no unsaved changes to save.', [{label:'OK', onclick:'closeModal()', cls:'modal-btn-primary'}], 'info'); return; }
    try {
        const r = await fetch(`${API}/api/final-lc/${jobId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ changes: modifiedFields }),
        });
        if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || 'Save failed'); }
        const d = await r.json();
        document.querySelectorAll('.modified').forEach(el => el.classList.remove('modified'));
        modifiedFields = {};
        changeCount = 0;
        document.getElementById('changeCount').textContent = `${d.changes_applied} change(s) saved`;
        showSuccess('Changes Saved', `<b>${d.changes_applied}</b> field(s) updated successfully.`);
    } catch (e) {
        showError('Save Failed', e.message);
    }
}

function downloadPDF() {
    window.open(`${API}/api/final-lc-pdf/${jobId}/${lcNumber || 'default'}`, '_blank');
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadData();
</script>

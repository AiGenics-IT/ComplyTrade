<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComplyTrade - Dashboard</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1554ca 0%,#0d3b8a 100%);min-height:100vh;padding:16px}
  .container{max-width:1200px;margin:0 auto}
  .header{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:16px}
  .header h1{font-size:1.6em;text-shadow:1px 1px 3px rgba(0,0,0,.2)}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav a{color:#fff;text-decoration:none;padding:6px 14px;border-radius:6px;font-size:.82em;background:rgba(255,255,255,.15);transition:.2s}
  .nav a:hover{background:rgba(255,255,255,.3)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .stat .num{font-size:2.2em;font-weight:800;line-height:1}
  .stat .label{font-size:.78em;color:#666;margin-top:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .stat.blue .num{color:#1554ca}
  .stat.green .num{color:#16a34a}
  .stat.red .num{color:#dc2626}
  .stat.amber .num{color:#d97706}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}

  .card{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);overflow:hidden}
  .card-header{padding:14px 18px;font-weight:700;font-size:.95em;color:#1a1a2e;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px}
  .card-body{padding:16px 18px}

  .bar-chart{display:flex;flex-direction:column;gap:8px}
  .bar-row{display:flex;align-items:center;gap:10px}
  .bar-label{width:120px;font-size:.78em;color:#555;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{flex:1;height:22px;background:#f0f2f5;border-radius:6px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:.72em;font-weight:700;color:#fff;transition:width .5s;min-width:fit-content}
  .bar-fill.blue{background:#1554ca}
  .bar-fill.red{background:#dc2626}
  .bar-fill.green{background:#16a34a}
  .bar-fill.amber{background:#d97706}
  .bar-count{font-size:.78em;color:#999;width:30px;text-align:right;flex-shrink:0}

  .recent-table{width:100%;border-collapse:collapse;font-size:.82em}
  .recent-table th{padding:8px 10px;text-align:left;font-size:.75em;text-transform:uppercase;color:#888;border-bottom:2px solid #eee;font-weight:700}
  .recent-table td{padding:8px 10px;border-bottom:1px solid #f5f5f5}
  .recent-table tr:hover{background:#f8f9ff}
  .status-pill{padding:2px 8px;border-radius:10px;font-size:.75em;font-weight:700}
  .status-pill.compliant{background:#dcfce7;color:#16a34a}
  .status-pill.discrepant{background:#fee2e2;color:#dc2626}
  .status-pill.review{background:#fef3c7;color:#d97706}
  .status-pill.processing{background:#dbeafe;color:#1554ca}

  .rate-circle{width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 10px}
  .rate-circle .pct{font-size:1.6em;font-weight:800}
  .rate-circle .rlabel{font-size:.7em;font-weight:600;opacity:.8}
  .rate-row{display:flex;justify-content:space-around;text-align:center}

  .version{text-align:center;color:rgba(255,255,255,.4);font-size:.75em;margin-top:10px}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Dashboard</h1>
    <div class="nav">
      <a href="/interface">Upload</a>
      <a href="/jobs">Jobs</a>
      <a href="/vessel-tracking">Vessels</a>
      <a href="/document-compare">Compare</a>
      <a href="/settings">Settings</a>
      <a href="/sanctions">Sanctions</a>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="grid2">
    <div class="card">
      <div class="card-header">Top Discrepancy Types</div>
      <div class="card-body" id="disc-chart"></div>
    </div>
    <div class="card">
      <div class="card-header">Compliance Rates</div>
      <div class="card-body" id="rates"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Recent Jobs</div>
    <div class="card-body" id="recent"></div>
  </div>

  <div class="version" id="version-tag"></div>
</div>

<script>
async function load() {
  const r = await fetch('/api/dashboard');
  const d = await r.json();

  // Stats
  document.getElementById('stats').innerHTML = `
    <div class="stat blue"><div class="num">${d.total_jobs}</div><div class="label">Total Jobs</div></div>
    <div class="stat green"><div class="num">${d.compliant}</div><div class="label">Compliant</div></div>
    <div class="stat red"><div class="num">${d.discrepant}</div><div class="label">Discrepant</div></div>
    <div class="stat amber"><div class="num">${d.avg_time}m</div><div class="label">Avg Time</div></div>
  `;

  // Discrepancy chart
  const discs = d.top_discrepancies || [];
  const maxCount = Math.max(...discs.map(x => x.count), 1);
  document.getElementById('disc-chart').innerHTML = discs.length === 0
    ? '<div style="color:#999;text-align:center;padding:20px">No discrepancies yet</div>'
    : '<div class="bar-chart">' + discs.map(x => `
      <div class="bar-row">
        <span class="bar-label" title="${esc(x.type)}">${esc(x.type)}</span>
        <div class="bar-track"><div class="bar-fill red" style="width:${Math.max(x.count/maxCount*100,8)}%">${x.count}</div></div>
      </div>`).join('') + '</div>';

  // Compliance rates
  const total = d.compliant + d.discrepant + d.review;
  const pPass = total ? Math.round(d.compliant/total*100) : 0;
  const pFail = total ? Math.round(d.discrepant/total*100) : 0;
  const pRev = total ? Math.round(d.review/total*100) : 0;
  document.getElementById('rates').innerHTML = `
    <div class="rate-row">
      <div><div class="rate-circle" style="border:4px solid #16a34a"><span class="pct" style="color:#16a34a">${pPass}%</span><span class="rlabel" style="color:#16a34a">Pass</span></div><div style="font-size:.8em;color:#666">${d.compliant} LCs</div></div>
      <div><div class="rate-circle" style="border:4px solid #dc2626"><span class="pct" style="color:#dc2626">${pFail}%</span><span class="rlabel" style="color:#dc2626">Fail</span></div><div style="font-size:.8em;color:#666">${d.discrepant} LCs</div></div>
      <div><div class="rate-circle" style="border:4px solid #d97706"><span class="pct" style="color:#d97706">${pRev}%</span><span class="rlabel" style="color:#d97706">Review</span></div><div style="font-size:.8em;color:#666">${d.review} LCs</div></div>
    </div>`;

  // Recent jobs
  const jobs = d.recent_jobs || [];
  document.getElementById('recent').innerHTML = jobs.length === 0
    ? '<div style="color:#999;text-align:center;padding:20px">No jobs yet</div>'
    : `<table class="recent-table"><thead><tr><th>LC Number</th><th>File</th><th>Status</th><th>Time</th><th>Date</th></tr></thead><tbody>
      ${jobs.map(j => `<tr>
        <td><b>${esc(j.lc_number||'-')}</b></td>
        <td>${esc(j.filename||'-')}</td>
        <td><span class="status-pill ${j.decision?.toLowerCase()||'processing'}">${esc(j.decision||j.status||'-')}</span></td>
        <td>${j.elapsed ? j.elapsed+'s' : '-'}</td>
        <td style="color:#888;font-size:.85em">${esc(j.date||'-')}</td>
      </tr>`).join('')}</tbody></table>`;

  try {
    const v = await (await fetch('/version')).json();
    document.getElementById('version-tag').textContent = 'Build: ' + (v.build || '');
  } catch(e) {}
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC Verification Checklist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .lc-title {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        .back-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .lc-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        .progress-summary {
            background: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .progress-item {
            text-align: center;
        }

        .progress-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .progress-label {
            color: #666;
            margin-top: 5px;
        }

        .main-content {
            background: white;
            border-radius: 0 0 20px 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            user-select: none;
        }

        .section-header:hover {
            transform: translateX(5px);
            transition: transform 0.2s;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5em;
            font-weight: bold;
        }

        .section-icon {
            font-size: 1.3em;
        }

        .section-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .section-content {
            padding: 0 10px;
        }

        .section-content.collapsed {
            display: none;
        }

        .checklist-item {
            background: #f8f9ff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #e0e0e0;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .checklist-item:hover {
            border-left-color: #667eea;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .checklist-item.checked {
            border-left-color: #28a745;
            background: #f0fff4;
        }

        .checklist-item.amended {
            border-left-color: #f093fb;
            background: #fff8fd;
        }

        .checkbox-container {
            position: relative;
            flex-shrink: 0;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .item-content {
            flex-grow: 1;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .item-number {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: bold;
            margin-right: 10px;
        }

        .item-text {
            color: #333;
            line-height: 1.6;
            font-size: 1em;
        }

        .item-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 10px;
        }

        .badge-amended {
            background: #f093fb;
            color: white;
        }

        .badge-field {
            background: #e0e7ff;
            color: #667eea;
        }

        .amendment-details {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border-left: 3px solid #f093fb;
        }

        .amendment-header {
            font-weight: 600;
            color: #f093fb;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .amendment-info {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .notes-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #e0e0e0;
        }

        .notes-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9em;
            resize: vertical;
            min-height: 60px;
        }

        .notes-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .action-buttons {
            position: sticky;
            bottom: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #f5c6cb;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .filter-bar {
            background: #f8f9ff;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-weight: 600;
            color: #666;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-box {
            flex-grow: 1;
            min-width: 250px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95em;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .lc-info-grid {
                grid-template-columns: 1fr;
            }

            .progress-summary {
                flex-direction: column;
                gap: 20px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media print {
            body {
                background: white;
            }

            .action-buttons,
            .back-btn,
            .filter-bar {
                display: none;
            }

            .checklist-item {
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div>
                    <div class="lc-title" id="lcNumber">Loading...</div>
                    <p style="color: #666; margin-top: 5px;">Letter of Credit Verification Checklist</p>
                </div>
                <a href="index.html" class="back-btn">
                    ← Back to Dashboard
                </a>
            </div>

            <div class="lc-info-grid" id="lcInfo"></div>
        </div>

        <div class="progress-summary">
            <div class="progress-item">
                <div class="progress-number" id="totalItems">0</div>
                <div class="progress-label">Total Items</div>
            </div>
            <div class="progress-item">
                <div class="progress-number" id="checkedItems" style="color: #28a745;">0</div>
                <div class="progress-label">Verified</div>
            </div>
            <div class="progress-item">
                <div class="progress-number" id="amendedItems" style="color: #f093fb;">0</div>
                <div class="progress-label">Amended</div>
            </div>
            <div class="progress-item">
                <div class="progress-number" id="progressPercent" style="color: #17a2b8;">0%</div>
                <div class="progress-label">Complete</div>
            </div>
        </div>

        <div class="main-content">
            <div class="filter-bar">
                <span class="filter-label">Filter:</span>
                <button class="filter-btn active" onclick="filterItems('all')">All Items</button>
                <button class="filter-btn" onclick="filterItems('checked')">Verified Only</button>
                <button class="filter-btn" onclick="filterItems('unchecked')">Pending Only</button>
                <button class="filter-btn" onclick="filterItems('amended')">Amended Only</button>
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search checklist items..." oninput="searchItems()">
                </div>
            </div>

            <div id="content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading checklist data...</p>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-success" onclick="markAllChecked()">
                ✓ Mark All Verified
            </button>
            <button class="btn btn-warning" onclick="clearAllChecks()">
                ✗ Clear All
            </button>
            <button class="btn btn-info" onclick="exportChecklist()">
                📥 Export to PDF
            </button>
            <button class="btn btn-primary" onclick="saveProgress()">
                💾 Save Progress
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lcNumber = urlParams.get('lc');
        const jobId = urlParams.get('job_id');
        const API_BASE = window.location.origin;

        let lcData = null;
        let checklistState = {};
        let currentFilter = 'all';

        // Load data on page load
        window.addEventListener('DOMContentLoaded', loadChecklistData);

        async function loadChecklistData() {
            if (!lcNumber || !jobId) {
                showError('Missing LC number or job ID');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/result/${jobId}`);
                const results = await response.json();

                // Find the consolidated LC
                const lc = results.consolidated_lcs.find(l => l.lc_number === lcNumber);

                if (!lc) {
                    showError('LC not found');
                    return;
                }

                lcData = lc;
                loadSavedProgress();
                renderChecklist();

            } catch (error) {
                showError('Failed to load checklist data: ' + error.message);
            }
        }

        function renderChecklist() {
            document.getElementById('lcNumber').textContent = lcData.lc_number;

            // Render LC Info
            const lcInfo = document.getElementById('lcInfo');
            lcInfo.innerHTML = `
                <div class="info-card">
                    <div class="info-label">Issue Date</div>
                    <div class="info-value">${lcData.issue_date || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Applicant</div>
                    <div class="info-value">${lcData.applicant?.split('\n')[0] || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Beneficiary</div>
                    <div class="info-value">${lcData.beneficiary?.split('\n')[0] || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Amount</div>
                    <div class="info-value">${lcData.amount || 'N/A'}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Amendments Applied</div>
                    <div class="info-value">${lcData.amendments_applied}</div>
                </div>
                <div class="info-card">
                    <div class="info-label">Page Reference</div>
                    <div class="info-value">${lcData.original_page_reference}</div>
                </div>
            `;

            // Render sections
            const content = document.getElementById('content');
            let html = '';

            // Documents Required Section
            if (lcData.documents_required && lcData.documents_required.length > 0) {
                html += renderSection(
                    'documents',
                    '📋 Documents Required',
                    lcData.documents_required,
                    '46A'
                );
            }

            // Additional Conditions Section
            if (lcData.additional_conditions && lcData.additional_conditions.length > 0) {
                html += renderSection(
                    'conditions',
                    '📝 Additional Conditions',
                    lcData.additional_conditions,
                    '47A'
                );
            }

            // Description of Goods
            if (lcData.fields?.Description_of_Goods) {
                html += `
                    <div class="section">
                        <div class="section-header" onclick="toggleSection(this)">
                            <div class="section-title">
                                <span class="section-icon">📦</span>
                                Description of Goods
                            </div>
                            <span class="section-count">1 item</span>
                        </div>
                        <div class="section-content">
                            <div class="checklist-item" id="item-goods-1">
                                <div class="checkbox-container">
                                    <input type="checkbox" class="checkbox" onchange="updateProgress()">
                                </div>
                                <div class="item-content">
                                    <div class="item-text">${lcData.fields.Description_of_Goods}</div>
                                    <div class="notes-section">
                                        <textarea class="notes-input" placeholder="Add verification notes..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Amendment History Section
            if (lcData.amendment_history && lcData.amendment_history.length > 0) {
                html += renderAmendmentHistory(lcData.amendment_history);
            }

            content.innerHTML = html;
            updateProgress();
        }

        function renderSection(sectionId, title, items, fieldCode) {
            let html = `
                <div class="section">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <span class="section-icon">${title.includes('Documents') ? '📋' : '📝'}</span>
                            ${title}
                        </div>
                        <span class="section-count">${items.length} items</span>
                    </div>
                    <div class="section-content">
            `;

            items.forEach((item, index) => {
                const itemId = `item-${sectionId}-${index}`;
                const isAmended = item.modified_by_amendment || item.added_by_amendment;

                html += `
                    <div class="checklist-item ${isAmended ? 'amended' : ''}" id="${itemId}" data-section="${sectionId}">
                        <div class="checkbox-container">
                            <input type="checkbox" class="checkbox" onchange="updateProgress()">
                        </div>
                        <div class="item-content">
                            <div class="item-header">
                                <div>
                                    ${item.point_number ? `<span class="item-number">Clause ${item.point_number}</span>` : ''}
                                    ${isAmended ? '<span class="item-badge badge-amended">AMENDED</span>' : ''}
                                    <span class="item-badge badge-field">Field ${item.field_code || fieldCode}</span>
                                </div>
                            </div>
                            <div class="item-text">${item.text}</div>
                            ${isAmended ? renderAmendmentBadge(item) : ''}
                            <div class="notes-section">
                                <textarea class="notes-input" placeholder="Add verification notes..."></textarea>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            return html;
        }

        function renderAmendmentBadge(item) {
            let html = '<div class="amendment-details">';
            html += '<div class="amendment-header">📝 Amendment Information</div>';
            html += '<div class="amendment-info">';

            if (item.modified_by_amendment) {
                html += '<div>✏️ <strong>Modified by amendment</strong></div>';
            }

            if (item.added_by_amendment) {
                html += '<div>➕ <strong>Added by amendment</strong></div>';
            }

            html += '</div></div>';
            return html;
        }

        function renderAmendmentHistory(history) {
            let html = `
                <div class="section">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <span class="section-icon">📜</span>
                            Amendment History
                        </div>
                        <span class="section-count">${history.length} amendments</span>
                    </div>
                    <div class="section-content">
            `;

            history.forEach((amend, index) => {
                const itemId = `item-amendment-${index}`;
                const totalChanges = (amend.changes?.conditions?.length || 0) +
                    (amend.changes?.documents?.length || 0) +
                    (amend.changes?.description_of_goods?.length || 0);

                html += `
                    <div class="checklist-item" id="${itemId}" data-section="amendment">
                        <div class="checkbox-container">
                            <input type="checkbox" class="checkbox" onchange="updateProgress()">
                        </div>
                        <div class="item-content">
                            <div class="item-header">
                                <div>
                                    <span class="item-number">Amendment ${amend.amendment_number}</span>
                                    <span class="item-badge badge-amended">Date: ${amend.amendment_date}</span>
                                    <span class="item-badge badge-field">Page: ${amend.page_reference}</span>
                                </div>
                            </div>
                            <div class="item-text">
                                <strong>Changes Summary:</strong>
                                <ul style="margin: 10px 0 10px 20px; line-height: 1.8;">
                                    <li>Conditions Changed: ${amend.changes?.conditions?.length || 0}</li>
                                    <li>Documents Changed: ${amend.changes?.documents?.length || 0}</li>
                                    <li>Goods Description Changed: ${amend.changes?.description_of_goods?.length || 0}</li>
                                    <li><strong>Total Changes: ${totalChanges}</strong></li>
                                </ul>
                            </div>
                            ${renderAmendmentChanges(amend.changes)}
                            <div class="notes-section">
                                <textarea class="notes-input" placeholder="Add verification notes for this amendment..."></textarea>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            return html;
        }

        function renderAmendmentChanges(changes) {
            if (!changes) return '';

            let html = '<div class="amendment-details" style="margin-top: 15px;">';
            html += '<div class="amendment-header">📋 Detailed Changes</div>';
            html += '<div class="amendment-info">';

            if (changes.conditions && changes.conditions.length > 0) {
                html += '<div style="margin-bottom: 15px;"><strong>Conditions:</strong><ul style="margin-left: 20px; margin-top: 5px;">';
                changes.conditions.forEach(change => {
                    if (change.change_text) {
                        html += `<li style="margin: 5px 0;">${change.change_text}</li>`;
                    }
                });
                html += '</ul></div>';
            }

            if (changes.documents && changes.documents.length > 0) {
                html += '<div style="margin-bottom: 15px;"><strong>Documents:</strong><ul style="margin-left: 20px; margin-top: 5px;">';
                changes.documents.forEach(change => {
                    if (change.change_text) {
                        html += `<li style="margin: 5px 0;">${change.change_text}</li>`;
                    }
                });
                html += '</ul></div>';
            }

            if (changes.description_of_goods && changes.description_of_goods.length > 0) {
                html += '<div style="margin-bottom: 15px;"><strong>Description of Goods:</strong><ul style="margin-left: 20px; margin-top: 5px;">';
                changes.description_of_goods.forEach(change => {
                    if (change.change_text) {
                        html += `<li style="margin: 5px 0;">${change.change_text}</li>`;
                    }
                });
                html += '</ul></div>';
            }

            html += '</div></div>';
            return html;
        }

        function toggleSection(header) {
            const content = header.nextElementSibling;
            content.classList.toggle('collapsed');
        }

        function updateProgress() {
            const allCheckboxes = document.querySelectorAll('.checkbox');
            const checkedCheckboxes = document.querySelectorAll('.checkbox:checked');
            const amendedItems = document.querySelectorAll('.checklist-item.amended');

            const total = allCheckboxes.length;
            const checked = checkedCheckboxes.length;
            const amended = amendedItems.length;
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;

            document.getElementById('totalItems').textContent = total;
            document.getElementById('checkedItems').textContent = checked;
            document.getElementById('amendedItems').textContent = amended;
            document.getElementById('progressPercent').textContent = percent + '%';

            // Update checked state on items
            allCheckboxes.forEach(checkbox => {
                const item = checkbox.closest('.checklist-item');
                if (checkbox.checked) {
                    item.classList.add('checked');
                } else {
                    item.classList.remove('checked');
                }
            });
        }

        function filterItems(filter) {
            currentFilter = filter;

            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            const items = document.querySelectorAll('.checklist-item');

            items.forEach(item => {
                const checkbox = item.querySelector('.checkbox');
                const isChecked = checkbox.checked;
                const isAmended = item.classList.contains('amended');

                let show = true;

                switch (filter) {
                    case 'checked':
                        show = isChecked;
                        break;
                    case 'unchecked':
                        show = !isChecked;
                        break;
                    case 'amended':
                        show = isAmended;
                        break;
                    default:
                        show = true;
                }

                item.style.display = show ? 'flex' : 'none';
            });
        }

        function searchItems() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.checklist-item');

            items.forEach(item => {
                const text = item.querySelector('.item-text').textContent.toLowerCase();
                const matches = text.includes(searchTerm);

                if (currentFilter === 'all' || matches) {
                    item.style.display = matches ? 'flex' : 'none';
                }
            });
        }

        function markAllChecked() {
            const checkboxes = document.querySelectorAll('.checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
            updateProgress();
        }

        function clearAllChecks() {
            const checkboxes = document.querySelectorAll('.checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            updateProgress();
        }

        function saveProgress() {
            const state = {};

            document.querySelectorAll('.checklist-item').forEach(item => {
                const checkbox = item.querySelector('.checkbox');
                const notes = item.querySelector('.notes-input').value;

                state[item.id] = {
                    checked: checkbox.checked,
                    notes: notes
                };
            });

            localStorage.setItem(`checklist_${lcNumber}`, JSON.stringify(state));
            alert('✅ Progress saved successfully!');
        }

        function loadSavedProgress() {
            const saved = localStorage.getItem(`checklist_${lcNumber}`);
            if (!saved) return;

            checklistState = JSON.parse(saved);
        }

        // Restore saved state after rendering
        function restoreSavedState() {
            Object.keys(checklistState).forEach(itemId => {
                const item = document.getElementById(itemId);
                if (!item) return;

                const state = checklistState[itemId];
                const checkbox = item.querySelector('.checkbox');
                const notes = item.querySelector('.notes-input');

                if (checkbox && state.checked) {
                    checkbox.checked = true;
                }

                if (notes && state.notes) {
                    notes.value = state.notes;
                }
            });

            updateProgress();
        }

        // Call restore after rendering
        setTimeout(restoreSavedState, 100);

        function exportChecklist() {
            window.print();
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error-message">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }
    </script>
</body>

</html>
